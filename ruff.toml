exclude = [
"src/*stubs",
'src/rx_q2',
'src/rx_web',
'src/post_ap',
'src/ecal_calibration',
'src/rx_orchestration']

[lint]
extend-safe-fixes = ["W291", "W293"]
select            = ["F", "PL", "B", "A", "ARG", "W291", "W293"]
ignore            = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "PLR2004", # Hardcoded values
  "PLC0415",
  "B008",
]

[format]
docstring-code-format = true
