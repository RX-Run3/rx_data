[workspace]
authors   = ['lhcb-phys-rx-run3@cern.ch']
channels  = ['conda-forge']
name      = 'cal-rx-run3'
platforms = ['linux-64']
version   = '0.1.0'

[activation.env]
TF_CPP_MIN_LOG_LEVEL      = '2'
TF_FORCE_GPU_ALLOW_GROWTH = 'true'

[dependencies]
python = '==3.13'
root   = '==6.38'
xrootd = '==5.9.1'

[pypi-dependencies]
apd                            = '*'
awkward                        = '*'
awkward-pandas                 = '*'
bokeh                          = '>=3.5.2'
boost-histogram                = '*'
colorama                       = '*'
dask                           = '*'
deprecated                     = '*'
dill                           = '*'
distributed                    = '*'
formulate                      = '*'
gvar                           = '>=13.1.10, <14'
hepstats                       = '*'
hepunits                       = '*'
hist                           = '*'
ihep-utilities                 = '==0.0.3'
iminuit                        = '*'
jacobi                         = '*'
jinja2                         = '*'
lazy_loader                    = '>=0.6,<0.7'
matplotlib                     = '*'
mplhep                         = '*'
numba                          = '*'
numdifftools                   = '*'
numexpr                        = '*'
numpy                          = '*'
omegaconf                      = '*'
optuna                         = '*'
pandas                         = '*'
pandas-stubs                   = '*'
particle                       = '*'
pidcalib2                      = '*'
pyarrow                        = '*'
pydantic                       = '*'
pyrefly                        = '*'
python-slugify                 = '*'
pyyaml                         = '*'
ruff                           = '*'
scikit-learn                   = '*'
scipy                          = '*'
seaborn                        = '*'
serena-agent                   = '*'
sigal                          = '*'
snakemake                      = '*'
snakemake-executor-plugin-ihep = '*'
snakemake-logger-plugin-flowo  = '*'
scipy-stubs                    = '*'
tensorflow-datasets            = '*'
tensorflow-graphics            = '*'
tensorflow-metadata            = '*'
tensorflow-probability         = '*'
types-tabulate                 = ">=0.10.0.20261006,<0.11"
types-tensorflow               = '*'
texttable                      = '*'
tf-keras                       = '*'
typer                          = '*'
uproot                         = '*'
uv                             = ">=0.13.5,<0.14"
vector                         = '*'
zfit                           = '*'
pytest-cov                     = '*'
pytest-mock                    = '*'
pytest-split                   = '*'
pytest-xdist                   = '*'
pytest-benchmark               = '*'

[feature.gpu.pypi-dependencies]
tensorflow = { version = "*", extras = ["and-cuda"] }

[feature.cpu.pypi-dependencies]
tensorflow = "*"

[feature.ana.pypi-dependencies]
ap_utilities     = { path = "./src/ap_utilities",     editable = true }
dmu              = { path = "./src/dmu",              editable = true }
hqm              = { path = "./src/hqm",              editable = true }
ecal_calibration = { path = "./src/ecal_calibration", editable = true }
fitter           = { path = "./src/fitter",           editable = true }
post_ap          = { path = "./src/post_ap",          editable = true }
root_stubs       = { path = "./src/root_stubs",       editable = true }
gvar-stubs       = { path = "./src/gvar-stubs",       editable = true }
rx_classifier    = { path = "./src/rx_classifier",    editable = true }
rx_common        = { path = "./src/rx_common",        editable = true }
rx_data          = { path = "./src/rx_data",          editable = true }
rx_efficiencies  = { path = "./src/rx_efficiencies",  editable = true }
rx_misid         = { path = "./src/rx_misid",         editable = true }
rx_orchestration = { path = "./src/rx_orchestration", editable = true }
rx_pid           = { path = "./src/rx_pid",           editable = true }
rx_plots         = { path = "./src/rx_plots",         editable = true }
rx_q2            = { path = "./src/rx_q2",            editable = true }
rx_selection     = { path = "./src/rx_selection",     editable = true }
rx_tests         = { path = "./src/rx_tests",         editable = true }
rx_web           = { path = "./src/rx_web",           editable = true }
vector_stubs     = { path = "./src/vector_stubs",     editable = true }
zfit-stubs       = { path = "./src/zfit-stubs",       editable = true }
systematics      = { path = "./src/systematics",      editable = true }

[feature.dev.dependencies]
pip              = '*'
pre-commit       = '>=4.7.0,<5'
btop             = '*'
chafa            = '*'
eza              = '*'
fzf              = '==0.67.0'
nvim             = '==0.11.0'
tmux             = '==3.7_'
yazi             = '==26.5.6'
zoxide           = '*'
lazygit          = ">=0.66.2,<0.67"

[environments]
default          = { features = ["gpu", 'dev', 'ana'] , solve-group = 'main'}
dev-cpu          = { features = ["cpu", 'dev', 'ana'] , solve-group = 'main'}
ci-cd            = { features = ["cpu"              ] , solve-group = 'main'}
