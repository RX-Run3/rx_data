[workspace]
authors   = ['lhcb-phys-rx-run3@cern.ch']
channels  = ['conda-forge']
name      = 'cal-rx-run3'
platforms = ['linux-64']
version   = '0.1.0'

[activation.env]
TF_CPP_MIN_LOG_LEVEL      = '2'
TF_FORCE_GPU_ALLOW_GROWTH = 'true'

[dependencies]
btop       = '*'
chafa      = '*'
eza        = '*'
fzf        = '==0.67.0'
go         = '*'
nvim       = '==0.11.0'
pip        = '*'
pre-commit = '>=4.7.0,<5'
pysocks    = '*'
python     = '==3.13'
root       = '==6.38'
tmux       = '==3.7_'
xrootd     = '==5.9.1'
yazi       = '==26.5.6'
zoxide     = '*'

[pypi-dependencies]
apd                                   = '*'
awkward                               = '*'
awkward-cpp                           = '*'
awkward-pandas                        = '*'
bokeh                                 = '>=3.5.2'
boost-histogram                       = '*'
colorama                              = '*'
dask                                  = '*'
deprecated                            = '*'
dill                                  = '*'
distributed                           = '*'
formulate                             = '*'
gvar                                  = '>=13.1.10, <14'
hepstats                              = '*'
hepunits                              = '*'
hist                                  = '*'
htcondor                              = '*'
ihep-utilities                        = '==0.0.3'
iminuit                               = '*'
jacobi                                = '*'
jinja2                                = '*'
lazy_loader                           = '>=0.6,<0.7'
matplotlib                            = '*'
mplhep                                = '*'
numba                                 = '*'
numdifftools                          = '*'
numexpr                               = '*'
numpy                                 = '*'
omegaconf                             = '*'
optuna                                = '*'
pandas                                = '*'
pandas-stubs                          = '*'
particle                              = '*'
pdg                                   = '*'
pidcalib2                             = '*'
pyarrow                               = '*'
pydantic                              = '*'
pyrefly                               = '*'
python-slugify                        = '*'
pyyaml                                = '*'
ruff                                  = '*'
scikit-learn                          = '*'
scipy                                 = '*'
scipy-stubs                           = '*'
seaborn                               = '*'
serena-agent                          = '*'
sigal                                 = '*'
snakemake                             = '*'
snakemake-executor-plugin-htcondor    = '*'
snakemake-executor-plugin-ihep        = '*'
snakemake-interface-common            = '*'
snakemake-interface-executor-plugins  = '*'
snakemake-interface-logger-plugins    = '*'
snakemake-interface-report-plugins    = '*'
snakemake-interface-scheduler-plugins = '*'
snakemake-interface-storage-plugins   = '*'
snakemake-logger-plugin-flowo         = '*'
snakemake-logger-plugin-rich          = '*'
snakemake-logger-plugin-snkmt         = '*'
tensorflow-datasets                   = '*'
tensorflow-graphics                   = '*'
tensorflow-metadata                   = '*'
tensorflow-probability                = '*'
texttable                             = '*'
tf-keras                              = '*'
types-tensorflow                      = '*'
typer                                 = '*'
uproot                                = '*'
uv                                    = ">=0.13.5,<0.14"
vector                                = '*'
zfit                                  = '*'
pytest-cov                            = '*'
pytest-mock                           = '*'
pytest-split                          = '*'
pytest-xdist                          = '*'
pytest-benchmark                      = '*'

[feature.gpu.pypi-dependencies]
tensorflow = { version = "*", extras = ["and-cuda"] }

[feature.cpu.pypi-dependencies]
tensorflow = "*"

[environments]
default = { features = ["gpu"] }
cpu     = { features = ["cpu"] }
