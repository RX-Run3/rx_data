[workspace]
authors   = ['lhcb-phys-rx-run3@cern.ch']
channels  = ['conda-forge']
name      = 'cal-rx-run3'
platforms = ['linux-64']
version   = '0.1.0'

[activation.env]
TF_CPP_MIN_LOG_LEVEL      = '2'
TF_FORCE_GPU_ALLOW_GROWTH = 'true'

[dependencies]
python = '==3.13'
root   = '==6.38'
xrootd = '==5.9.1'

[pypi-dependencies]
apd                            = '*'
awkward                        = '*'
awkward-pandas                 = '*'
bokeh                          = '>=3.5.2'
boost-histogram                = '*'
colorama                       = '*'
dask                           = '*'
deprecated                     = '*'
dill                           = '*'
distributed                    = '*'
formulate                      = '*'
gvar                           = '>=13.1.10, <14'
hepstats                       = '*'
hepunits                       = '*'
hist                           = '*'
ihep-utilities                 = '==0.0.3'
iminuit                        = '*'
jacobi                         = '*'
jinja2                         = '*'
lazy_loader                    = '>=0.6,<0.7'
matplotlib                     = '*'
mplhep                         = '*'
numba                          = '*'
numdifftools                   = '*'
numexpr                        = '*'
numpy                          = '*'
omegaconf                      = '*'
optuna                         = '*'
pandas                         = '*'
pandas-stubs                   = '*'
particle                       = '*'
pidcalib2                      = '*'
pyarrow                        = '*'
pydantic                       = '*'
pyrefly                        = '*'
python-slugify                 = '*'
pyyaml                         = '*'
ruff                           = '*'
scikit-learn                   = '*'
scipy                          = '*'
seaborn                        = '*'
serena-agent                   = '*'
sigal                          = '*'
snakemake                      = '*'
snakemake-executor-plugin-ihep = '*'
snakemake-logger-plugin-flowo  = '*'
scipy-stubs                    = '*'
tensorflow-datasets            = '*'
tensorflow-graphics            = '*'
tensorflow-metadata            = '*'
tensorflow-probability         = '*'
types-tensorflow               = '*'
texttable                      = '*'
tf-keras                       = '*'
typer                          = '*'
uproot                         = '*'
uv                             = ">=0.13.5,<0.14"
vector                         = '*'
zfit                           = '*'
pytest-cov                     = '*'
pytest-mock                    = '*'
pytest-split                   = '*'
pytest-xdist                   = '*'
pytest-benchmark               = '*'

[feature.gpu.pypi-dependencies]
tensorflow = { version = "*", extras = ["and-cuda"] }

[feature.cpu.pypi-dependencies]
tensorflow = "*"

[feature.dev.dependencies]
pip              = '*'
pre-commit       = '>=4.7.0,<5'
btop             = '*'
chafa            = '*'
eza              = '*'
fzf              = '==0.67.0'
nvim             = '==0.11.0'
tmux             = '==3.7_'
yazi             = '==26.5.6'
zoxide           = '*'
lazygit          = ">=0.66.2,<0.67"

[environments]
default = { features = ["gpu", 'dev'] }
dev-cpu = { features = ["cpu", 'dev'] }
ci-cd   = { features = ["cpu"] }
