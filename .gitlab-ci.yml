# Taken from:
# https://gitlab.cern.ch/gitlabci-examples/build_docker_image/-/blob/master/.gitlab-ci.yml?ref_type=heads#L54
stages:
  - test
  - build
  - tests
environment:
  stage: build
  image: registry.cern.ch/quay.io/buildah/stable
  before_script:
    - sed -i 's/^driver = .*/driver = "vfs"/' /etc/containers/storage.conf
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - >-
      buildah      bud --layers
      --cache-from "$CI_REGISTRY_IMAGE/cache"
      --cache-to   "$CI_REGISTRY_IMAGE/cache"
      -t           "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      -f           Dockerfile .
    - buildah push    $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
tests:
  stage: tests
  image: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  script:
    - pytest src/selection/tests/test_selection.py
    - pytest src/selection/tests/test_registry.py
    #- pytest src/selection/tests/test_truth_matching.py
