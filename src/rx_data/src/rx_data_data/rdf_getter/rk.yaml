# JPSI_PDG_MASS = 3096.90 # https://pdg.lbl.gov/2018/listings/rpp2018-list-J-psi-1S.pdf
# BPLS_PDG_MASS = 5279.34 # https://pdg.lbl.gov/2022/tables/rpp2022-tab-mesons-bottom.pdf

common: &common
  total_charge                                              : H_ID / TMath::Abs(H_ID) - L1_ID / TMath::Abs(L1_ID) - L2_ID / TMath::Abs(L2_ID)
  H_PHI                                                     : H_PHI_rft
  # ---------
  H_isMuon                                                  : H_ISMUON
  # -------
  H_ProbNNmu                                                : H_PROBNN_MU
  # -------
  L1_ProbNNk                                                : L1_PROBNN_K
  L2_ProbNNk                                                : L2_PROBNN_K
  # -------
  H_PIDmu                                                   : H_PID_MU
  # -------
  H_PIDk                                                    : H_PID_K
  L1_PIDk                                                   : L1_PID_K
  L2_PIDk                                                   : L2_PID_K
  # -------
  H_ProbNNp                                                 : H_PROBNN_P
  L1_ProbNNp                                                : L1_PROBNN_P
  L2_ProbNNp                                                : L2_PROBNN_P
  # ---------
  B_HEAD_CC_B_ChargedIso_DR2_0p15_CP                        : B_HEAD_CC_bp_ChargedIso_DR2_0p25_CP      # PRC BDT uses 0.15 cone, we kept 0.25
  B_HEAD_CC_B_ChargedIso_DR2_0p15_PTASY                     : B_HEAD_CC_bp_ChargedIso_DR2_0p25_PTASY   # Might not matter, cone isolation does
  B_HEAD_CC_B_ChargedIso_DR2_0p15_CMULT                     : B_HEAD_CC_bp_ChargedIso_DR2_0p25_CMULT   # not provide high discriminating power
  B_HEAD_NC_B_NeutralIso_DR2_0p15_CP                        : B_HEAD_NC_bp_NeutralIso_DR2_0p25_CP
  B_HEAD_NC_B_NeutralIso_DR2_0p15_PTASY                     : B_HEAD_NC_bp_NeutralIso_DR2_0p25_PTASY
  B_HEAD_NC_B_NeutralIso_DR2_0p15_CMULT                     : B_HEAD_NC_bp_NeutralIso_DR2_0p25_CMULT
  # ---------
  B_VTXISO_B_OneTrack_DChi2Vtx_9p0_NParts                   : B_VTXISO_bp_OneTrack_DChi2Vtx_9p0_NParts
  B_VTXISO_B_OneTrack_DChi2Vtx_9p0_Smallest_CHI2            : B_VTXISO_bp_OneTrack_DChi2Vtx_9p0_Smallest_CHI2
  B_VTXISO_B_OneTrack_DChi2Vtx_9p0_Smallest_DELTACHI2       : B_VTXISO_bp_OneTrack_DChi2Vtx_9p0_Smallest_DELTACHI2
  B_VTXISO_B_OneTrack_DChi2Vtx_9p0_Smallest_DELTACHI2_MASS  : B_VTXISO_bp_OneTrack_DChi2Vtx_9p0_Smallest_DELTACHI2_MASS
  B_VTXISO_B_TwoTracks_DChi2Vtx_9p0_NParts                  : B_VTXISO_bp_TwoTracks_DChi2Vtx_9p0_NParts
  B_VTXISO_B_TwoTracks_DChi2Vtx_9p0_Smallest_CHI2           : B_VTXISO_bp_TwoTracks_DChi2Vtx_9p0_Smallest_CHI2
  B_VTXISO_B_TwoTracks_DChi2Vtx_9p0_Smallest_DELTACHI2      : B_VTXISO_bp_TwoTracks_DChi2Vtx_9p0_Smallest_DELTACHI2
  B_VTXISO_B_TwoTracks_DChi2Vtx_9p0_Smallest_DELTACHI2_MASS : B_VTXISO_bp_TwoTracks_DChi2Vtx_9p0_Smallest_DELTACHI2_MASS
definitions:
  DATA:
    <<: *common
  MC:
    <<: *common
TRUEM:
  B_mass : 'ROOT::Math::XYZVector L1_3D(L1_TRUEPX, L1_TRUEPY, L1_TRUEPZ); auto L1_truept=L1_3D.Rho(); auto L1_trueeta=L1_3D.Eta(); auto L1_truephi=L1_3D.Phi();
        ROOT::Math::XYZVector L2_3D(L2_TRUEPX, L2_TRUEPY, L2_TRUEPZ); auto L2_truept=L2_3D.Rho(); auto L2_trueeta=L2_3D.Eta(); auto L2_truephi=L2_3D.Phi();
        ROOT::Math::XYZVector  H_3D( H_TRUEPX,  H_TRUEPY,  H_TRUEPZ); auto  H_truept= H_3D.Rho(); auto  H_trueeta= H_3D.Eta(); auto  H_truephi= H_3D.Phi();

        ROOT::Math::PtEtaPhiM4D<double> L1_4DP(L1_truept, L1_trueeta, L1_truephi, 0.511);
        ROOT::Math::PtEtaPhiM4D<double> L2_4DP(L2_truept, L2_trueeta, L2_truephi, 0.511);
        ROOT::Math::PtEtaPhiM4D<double>  H_4DP( H_truept,  H_trueeta,  H_truephi, 493.7);

        ROOT::Math::LorentzVector<ROOT::Math::PtEtaPhiM4D<double>> L1_4D(L1_4DP);
        ROOT::Math::LorentzVector<ROOT::Math::PtEtaPhiM4D<double>> L2_4D(L2_4DP);
        ROOT::Math::LorentzVector<ROOT::Math::PtEtaPhiM4D<double>>  H_4D( H_4DP);

        auto bpls_4d = L1_4D + L2_4D + H_4D;
        auto val     = bpls_4d.M(); return val!=val ? 5279.34 : val'
