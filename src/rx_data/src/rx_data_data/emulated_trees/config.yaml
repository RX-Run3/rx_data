# This is a config meant to specify how to emulate a sample

# ----------------------------------------
mc:
  samples :
    mc : 1.0
  patching:
    3 : 2
    4 : 2
# ----------------------------------------
bpkxkpipiee:
  samples:
    bpk1kpipiee : 0.5
    bpk2kpipiee : 0.5
# ----------------------------------------
# samples starting from Bs decay can be modelled
# with samples starting from Bd decay
# ----------------------------------------
bskstjpsimm:
  samples :
    bdkstkpijpsimm : 1.0
  redefine : &red_001
    B_M                  : B_M                  + 87.23
    B_Mass               : B_Mass               + 87.23
    B_const_mass_M       : B_const_mass_M       + 87.23
    B_const_mass_psi2S_M : B_const_mass_psi2S_M + 87.23
    B_ID                 : '531'
    B_TRUEID             : 'TMath::Abs(B_TRUEID)         == 511 ? 531 :          B_TRUEID'
    Kst_MC_MOTHER_ID     : 'TMath::Abs(Kst_MC_MOTHER_ID) == 511 ? 531 :  Kst_MC_MOTHER_ID'
    Jpsi_MC_MOTHER_ID    : 'TMath::Abs(Jpsi_MC_MOTHER_ID)== 511 ? 531 : Jpsi_MC_MOTHER_ID'
bskstjpsiee:
  samples :
    bdkstkpijpsiee : 1.0
  redefine :
    <<: *red_001
bskstpsi2mm:
  samples :
    bdkstkpipsi2mm : 1.0
  redefine :
    <<: *red_001
bskstpsi2ee:
  samples :
    bdkstkpipsi2ee : 1.0
  redefine :
    <<: *red_001
# ----------------------------------------
# These samples are meant to represent
# hadronic swapped (K -> pi and pi -> K) decays
# ----------------------------------------
bdkstkpijpsimm_kpimm_pikmm:
  samples   :
    bdkstkpijpsimm : 1.0
  trk_swap  :
    H1_ : H2_
  masses:
    Kst_M:
      H1 :  321
      H2 : -211
bdkstkpijpsiee_kpiee_pikee:
  samples   :
    bdkstkpijpsiee : 1.0
  trk_swap  :
    H1_ : H2_
  masses:
    Kst_M:
      H1 :  321
      H2 : -211
# ----------------------------------------
# pi <-> mu/e swaps
# ----------------------------------------
bdkstkpijpsimm_kpimm_kmpim:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bdkstkpijpsimm : 1.0
  trk_swap  :
    H2_ : L2_
  masses:
    Kst_M:
      H1 :  321
      H2 : -211
    Jpsi_M:
      L1 :  13
      L2 : -13
bdkstkpijpsiee_kpiee_kepie:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bdkstkpijpsiee : 1.0
  trk_swap  :
    H2_ : L2_
  masses:
    Kst_M:
      H1 :  321
      H2 : -211
    Jpsi_M:
      L1 :  11
      L2 : -11
# ----------------------------------------
# K <-> mu/e swaps
# ----------------------------------------
bdkstkpijpsimm_kpimm_mpimk:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bdkstkpijpsimm : 1.0
  trk_swap  :
    H1_ : L1_
  masses:
    Kst_M:
      H1 :  321
      H2 : -211
    Jpsi_M:
      L1 :  13
      L2 : -13
bdkstkpijpsiee_kpiee_epiek:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bdkstkpijpsiee : 1.0
  trk_swap  :
    H1_ : L1_
  masses:
    Kst_M:
      H1 : 321
      H2 : 211
    Jpsi_M:
      L1 :  11
      L2 : -11
# ----------------------------------------
# k <-> mu/e swaps
# ----------------------------------------
bpkpjpsimm_kmm_mkm:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bpkpjpsimm     : 1.0
  trk_swap  :
    H_ : L1_
  masses:
    Jpsi_M:
      L1 :  13
      L2 : -13
bpkpjpsiee_kee_eke:
  redefine  :
    q2 : Jpsi_M * Jpsi_M
  samples   :
    bpkpjpsiee     : 1.0
  trk_swap  :
    H_ : L1_
  masses:
    Jpsi_M:
      L1 :  11
      L2 : -11
# ----------------------------------------
bsjpsixmm:
  samples :
    bsjpsixmm : 1.0
  patching:
    1 : 5
    2 : 5
    3 : 5
    4 : 5
# ----------------------------------------
bpjpsixmm:
  samples :
    bpjpsixmm : 1.0
  patching:
    1 : 5
    2 : 5
    3 : 5
    4 : 5
# ----------------------------------------
bdkstkpipsi2mm:
  samples :
    bdkstkpipsi2mm : 1.0
  patching:
    4 : 2
    3 : 2
    7 : 6
    8 : 6
# ----------------------------------------
bdkstkpipsi2ee:
  samples :
    bdkstkpipsi2ee : 1.0
  patching:
    4 : 2
    3 : 2
