# This is a config meant to specify how to emulate a sample

# ----------------------------------------
simulation:
  samples  : 
    any : 1.0
  patching:
    3 : 5
    4 : 5
# ----------------------------------------
Bu_KxKpipi:
  samples:
    Bu_K1ee_eq_DPC                 : 0.5
    Bu_K2stee_Kpipi_eq_mK1430_DPC  : 0.5
# ----------------------------------------
# samples starting from Bs decay can be modelled
# with samples starting from Bd decay
# ----------------------------------------
Bs_JpsiKst_mm_eq_DPC : 
  samples : 
    Bd_JpsiKst_mm_eq_DPC : 1.0
  redefine : &red_001
    B_M                  : B_M                  + 87.23
    B_Mass               : B_Mass               + 87.23
    B_M_brem_track_2     : B_M_brem_track_2     + 87.23
    B_const_mass_M       : B_const_mass_M       + 87.23
    B_const_mass_psi2S_M : B_const_mass_psi2S_M + 87.23
    B_ID                 : '531'
    B_TRUEID             : 'TMath::Abs(B_TRUEID)         == 511 ? 531 :          B_TRUEID'
    Kst_MC_MOTHER_ID     : 'TMath::Abs(Kst_MC_MOTHER_ID) == 511 ? 531 :  Kst_MC_MOTHER_ID'
    Jpsi_MC_MOTHER_ID    : 'TMath::Abs(Jpsi_MC_MOTHER_ID)== 511 ? 531 : Jpsi_MC_MOTHER_ID'
Bs_JpsiKst_ee_eq_DPC :
  samples : 
    Bd_JpsiKst_ee_eq_DPC : 1.0
  redefine :
    <<: *red_001
# ----------------------------------------
# These samples are meant to represent
# hadronic swapped (K -> pi and pi -> K) decays
# ----------------------------------------
Bd_JpsiKst_mm_had_swp:
  samples   : 
    Bd_JpsiKst_mm_eq_DPC : 1.0
Bd_JpsiKst_ee_had_swp:
  samples   : 
    Bd_JpsiKst_ee_eq_DPC : 1.0
# ----------------------------------------
Bs_JpsiX_mm_eq_JpsiInAcc:
  samples : 
    Bs_JpsiX_mm_eq_JpsiInAcc : 1.0
  patching:
    1 : 5
    2 : 5
    3 : 5
    4 : 5
# ----------------------------------------
Bu_JpsiX_mm_eq_JpsiInAcc:
  samples : 
    Bu_JpsiX_mm_eq_JpsiInAcc : 1.0
  patching:
    1 : 5
    2 : 5
    3 : 5
    4 : 5
# ----------------------------------------
Bd_psi2SKst_mm_eq_DPC:
  samples : 
    Bd_psi2SKst_mm_eq_DPC : 1.0
  patching:
    4 : 2
    3 : 2
    7 : 6
    8 : 6
# ----------------------------------------
Bd_psi2SKst_ee_eq_DPC:
  samples :
    Bd_psi2SKst_mm_eq_DPC : 1.0
  patching:
    4 : 2
    3 : 2
