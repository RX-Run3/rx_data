# This config file is meant to be used by `copy_samples`, it specifies:
# Where the samples are
# Where the samples should be copied to
# What samples should be copied

triggers:
  - rkst_ee_os
  - rkst_ee_misid
  - rkst_ee_ss
  - rkst_mm_os
  - rkst_mm_ss
samples :
  data:
    - DATA_24_MagDown_24c2
    - DATA_24_MagDown_24c3
    - DATA_24_MagDown_24c4
    - DATA_24_MagUp_24c2
    - DATA_24_MagUp_24c3
    - DATA_24_MagUp_24c4
  rk_signal:
    - 12123003 # Kee
    - 12113002 # Kmm
  rkst_signal:
    - 11124002 # K*ee
    - 11114002 # K*mumu
  inc_ee:
    - 11453001 # Bd eeX
    - 12952000 # Bp eeX
    - 13454001 # Lb eeX
  inc_mm:
    - 11442001
    - 12442001
    - 13442001
  semileptonic:
    - 11584030 # B -> D*(D(Kpi)  pi) enu
    - 11584022 # B -> D(K*(Kpi) enu) enu
  #-------
    - 11574030 # B -> D(K*(Kpi) munu) munu
    #- 11574090 # B -> D*(D(Kpi)   pi) munu
  resonant:
    - 11144002 # Bd -> Jpsi(mm) Kst
    - 11154002 # Bd -> Jpsi(ee) Kst
    - 11144011 # Bd -> Psi2(mm) Kst
    - 11154011 # Bd -> Psi2(ee) Kst
  reso_bkg:
    - 15154001 # Lb -> Jpsi(ee) pK
    - 15144001 # Lb -> Jpsi(mm) pK
    - 13154001 # Bs -> Jpsi(ee) phi
    - 13144001 # Bs -> Jpsi(mm) phi
  prec:
    - 13124006 # Bs -> phi ee
    - 12123445 # K*+ee
    - 12425000 # B+ -> K1 K pipi ee
    - 12425011 # B+ -> K2 K pipi ee
    - 12125000 # B+ -> Kpipi ee LSFLAT
  misid:
    - 11104000 # B0 -> pipi K*(-> Kpi)
