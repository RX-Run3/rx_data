    - 0.05961
    - 0.00033
  # J/psi -> ee
  jpee: # picked electron one
    - 0.05961
    - 0.00033
  # psi2S -> ee
  psee: # https://pdglive.lbl.gov/Particle.action?init=0&node=M071&home=MXXX025
    - 0.00795
    - 0.00022
