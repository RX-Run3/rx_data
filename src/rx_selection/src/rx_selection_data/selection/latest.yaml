cascade_common : &cascade_common
  low     : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  central : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  cen_low : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  cen_high: (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  jpsi    : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  psi2    : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900)
  high    : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900) || (swp_cascade_mass_swp < 1800)
  none    : (swp_cascade_mass_swp != swp_cascade_mass_swp) || (swp_cascade_mass_swp > 1900) || (swp_cascade_mass_swp < 1800)

jpsi_misid_common: &jmd_common
  low     : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  central : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  cen_low : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  cen_high: (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  jpsi    : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  psi2    : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
  high    : 'true' 
  none    : (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)

# ----------------------------------
# MVA
# ----------------------------------
cmb_rkst_common: &cmb_rkst_common
  low     : mva_cmb > 0.98
  central : mva_cmb > 0.98
  jpsi    : mva_cmb > 0.98
  psi2    : mva_cmb > 0.98
  high    : mva_cmb > 0.60
  none    : mva_cmb > 0.60

prc_rkst_common: &prc_rkst_common
  low     : mva_prc > 0.60
  central : mva_prc > 0.40
  jpsi    : mva_prc > 0.40
  psi2    : mva_prc > 0.40
  high    : mva_prc > 0.80
  none    : mva_prc > 0.80
# ----------------------------------
cmb_rk_common: &cmb_rk_common
  low     : mva_cmb > 0.90
  central : mva_cmb > 0.95
  jpsi    : mva_cmb > 0.95
  psi2    : mva_cmb > 0.95
  high    : mva_cmb > 0.60
  none    : mva_cmb > 0.60

prc_rk_common: &prc_rk_common
  low     : mva_prc > 0.60
  central : mva_prc > 0.60
  jpsi    : mva_prc > 0.60
  psi2    : mva_prc > 0.60
  high    : mva_prc > 0.80
  none    : mva_prc > 0.80
# ----------------------------------
q2_common: &q2_common
  low     : (q2       >   100000) && (q2 <  1100000)
  central : (q2       >  1100000) && (q2 <  6000000)
  cen_low : (q2       >  1100000) && (q2 <  4000000)
  cen_high: (q2       >  4000000) && (q2 <  6000000)
  jpsi    : (q2       >  6000000) && (q2 < 11000000)
  psi2    : (q2       > 11000000) && (q2 < 15000000)
  high    : (q2       > 15000000) && (q2 < 22000000)
  none    : 'true'

hop_common: &hop_common
  low     : hop_mass > 4500
  central : hop_mass > 4500
  cen_low : hop_mass > 4500
  cen_high: hop_mass > 4500
  jpsi    : hop_mass > 4500
  psi2    : hop_mass > 4500
  high    : hop_mass > 3000
  none    : hop_mass > 3000

# B_Mass, as defined in rx_data config.yaml, should be the brem corrected mass
mass_ee   : &mass_ee
  low     : 'true'
  central : 'true'
  cen_low : 'true'
  cen_high: 'true'
  jpsi    : 'true'
  psi2    : 'true'
  high    : 'true'
  none    : 'true'

mass_mm  : &mass_mm
  low     : 'true'
  central : 'true'
  cen_low : 'true'
  cen_high: 'true'
  jpsi    : 'true'
  psi2    : 'true'
  high    : 'true'
  none    : 'true'
# --------------------
rkst: &rkst
  ee:
    q2:
      <<: *q2_common
    ghost     : H1_TRACK_GhostProb < 0.3 && H2_TRACK_GhostProb < 0.3 && L1_TRACK_GhostProb < 0.3 && L2_TRACK_GhostProb< 0.3
    hlt1      : (B_Hlt1TrackMVADecision_TOS == 1) || (B_Hlt1TwoTrackMVADecision_TOS == 1)
    hlt2      : (1)
    kinem_lep : L1_PT > 250 && L2_PT > 250 && L1_P > 3000 && L2_P > 3000
    kinem_had : H1_PT > 300 && H2_PT > 300 && H1_P > 2500 && H2_P > 2500
    kst_mass  : TMath::Abs(Kst_M - 892) < 100
    kst_pt    : Kst_PT > 500
    tr_ipchi2 : H1_IPCHI2_OWNPV > 9 && H2_IPCHI2_OWNPV > 9 && L1_IPCHI2_OWNPV > 9 && L2_IPCHI2_OWNPV > 9
    pid_l     : L1_ProbNNe > 0.2 && L2_ProbNNe > 0.2 && L1_PIDe  > 3.000 && L2_PIDe  > 3.000
    pid_k     : (H1_ProbNNk   * (1 - H1_PROBNN_P) > 0.05) && H1_PID_K > 0
    pid_pi    : (H2_PROBNN_PI * (1 - H2_PROBNN_P) * (1 - H2_ProbNNk) > 0.1)
    rich      : L1_PPHASRICH && L2_PPHASRICH && H1_PPHASRICH && H2_PPHASRICH
    acceptance: L1_INECAL && L2_INECAL
    jpsi_misid: (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
    cascade   :
      <<: *cascade_common
    hop       :
      <<: *hop_common
    cmb       :
      <<: *cmb_rkst_common
    prc       :
      <<: *prc_rkst_common
    mass:
      <<: *mass_ee
  mm:
    q2:
      <<: *q2_common
    ghost     : H1_TRACK_GhostProb < 0.3 && H2_TRACK_GhostProb < 0.3 && L1_TRACK_GhostProb < 0.3 && L2_TRACK_GhostProb< 0.3
    hlt1      : (B_Hlt1TrackMVADecision_TOS == 1) || (B_Hlt1TwoTrackMVADecision_TOS == 1)
    hlt2      : (1)
    kinem_lep : L1_PT > 250 && L2_PT > 250 && L1_P > 3000 && L2_P > 3000
    kinem_had : H1_PT > 300 && H2_PT > 300 && H1_P > 2500 && H2_P > 2500
    kst_mass  : TMath::Abs(Kst_M - 892) < 100
    kst_pt    : Kst_PT > 500
    tr_ipchi2 : H1_IPCHI2_OWNPV > 9 && H2_IPCHI2_OWNPV > 9 && L1_IPCHI2_OWNPV > 9 && L2_IPCHI2_OWNPV > 9
    pid_l     : L1_ProbNNmu> 0.2 && L2_ProbNNmu> 0.2 && L1_isMuon && L2_isMuon && L1_PIDmu >-3. && L2_PIDmu > -3
    pid_k     : (H1_ProbNNk   * (1 - H1_PROBNN_P) > 0.05) && H1_PID_K > 0
    pid_pi    : (H2_PROBNN_PI * (1 - H2_PROBNN_P) * (1 - H2_ProbNNk) > 0.1)
    rich      : L1_PPHASRICH && L2_PPHASRICH && H1_PPHASRICH && H2_PPHASRICH
    acceptance: L1_INMUON && L2_INMUON
    jpsi_misid: (swp_jpsi_misid_mass_swp != swp_jpsi_misid_mass_swp) || (swp_jpsi_misid_mass_swp < 3050) || (swp_jpsi_misid_mass_swp > 3150)
    cascade   :
      <<: *cascade_common
    hop       :
      <<: *hop_common
    cmb       :
      <<: *cmb_rkst_common
    prc       :
      <<: *prc_rkst_common
    mass:
      <<: *mass_mm
rk: &rk
  ee:
    q2:
      <<: *q2_common
    ghost     : H_TRACK_GhostProb<0.3 && L1_TRACK_GhostProb <0.3 && L2_TRACK_GhostProb<0.3
    hlt1      : (B_Hlt1TrackMVADecision_TOS == 1) || (B_Hlt1TwoTrackMVADecision_TOS == 1)
    hlt2      : (1)
    kinem_lep : L1_PT > 250 && L2_PT > 250 && L1_P > 3000 && L2_P > 3000
    kinem_had : H_PT > 300 && H_P > 2500
    clones    : (th_l1_l2 > 5e-4) && (th_l1_kp > 5e-4) && (th_l2_kp > 5e-4)
    tr_ipchi2 : H_IPCHI2_OWNPV > 9 && L1_IPCHI2_OWNPV > 9 && L2_IPCHI2_OWNPV > 9
    pid_l     : L1_ProbNNe > 0.2 && L2_ProbNNe > 0.2 && L1_PIDe  > 3.000 && L2_PIDe  > 3.000
    pid_k     : H_PIDe <  0.000 && H_PID_K > 2.0
    rich      : L1_PPHASRICH && L2_PPHASRICH && H_PPHASRICH
    acceptance: L1_INECAL    && L2_INECAL
    jpsi_misid:
      <<: *jmd_common
    cascade   :
      <<: *cascade_common
    hop       :
      <<: *hop_common
    cmb       :
      <<: *cmb_rk_common
    prc       :
      <<: *prc_rk_common
    mass:
      <<: *mass_ee
  mm:
    q2:
      <<: *q2_common
    ghost     : H_TRACK_GhostProb < 0.3 && L1_TRACK_GhostProb < 0.3 && L2_TRACK_GhostProb< 0.3
    hlt1      : (B_Hlt1TrackMVADecision_TOS == 1) || (B_Hlt1TwoTrackMVADecision_TOS == 1)
    hlt2      : (1)
    kinem_lep : L1_PT > 250 && L2_PT > 250 && L1_P > 3000 && L2_P > 3000
    kinem_had : H_PT > 300 && H_P > 2500
    clones    : (th_l1_l2 > 5e-4) && (th_l1_kp > 5e-4) && (th_l2_kp > 5e-4)
    tr_ipchi2 : H_IPCHI2_OWNPV > 9 && L1_IPCHI2_OWNPV > 9 && L2_IPCHI2_OWNPV > 9
    pid_l     : L1_ProbNNmu> 0.2 && L2_ProbNNmu> 0.2 && L1_isMuon && L2_isMuon && L1_PIDmu >-3. && L2_PIDmu > -3
    pid_k     : (H_ProbNNk   * (1 - H_PROBNN_P) > 0.05) && H_PID_K > 0
    rich      : L1_PPHASRICH && L2_PPHASRICH && H_PPHASRICH
    acceptance: L1_INMUON && L2_INMUON
    jpsi_misid:
      <<: *jmd_common
    cascade   :
      <<: *cascade_common
    hop       :
      <<: *hop_common
    cmb       :
      <<: *cmb_rk_common
    prc       :
      <<: *prc_rk_common
    mass:
      <<: *mass_mm
# --------------------
rkst_no_pid:
  <<: *rkst
rk_no_pid:
  <<: *rk
