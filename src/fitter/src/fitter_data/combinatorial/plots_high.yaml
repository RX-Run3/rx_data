style : &style
  xrotation : 45
  alpha     : 0.5
# ------------------------
size    : [15, 10]
xname   : Fit
styles  :
  nev:
    xrotation : 45
    alpha     : 1.0
    ylabel    : Entries
    yrange    : [0, 4000]
  mu_suj_cmb_1:
    <<: *style
    ylabel: $\mu$
    yrange: [4500, 5500]
  sg_suj_cmb_1:
    <<: *style
    ylabel: $\sigma$
    yrange: [  0,  1200]
  pvalue:
    <<: *style
    ylabel    : p-value
    yrange    : [0.0, 1.0]
labels :
  OS  : Opposite Sign
  SS  : Same Sign
  +++ : $B^+\to K^+e^+e^+ + cc$
  +-- : $B^+\to K^+e^-e^- + cc$
groups :
  OS_vs_SS:
    - OS
    - SS
  p3_vs_p1:
    - +++
    - +--
    -  SS
