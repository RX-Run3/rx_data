selection:
  truth   : (1)
  cmb     : (1)
  prc     : mva_prc > 0.6
  mass    : (1)
cutflows:
  cmb_window:
    0.50-0.60 : mva_cmb > 0.50 && mva_cmb < 0.60
    0.60-0.70 : mva_cmb > 0.60 && mva_cmb < 0.70
    0.70-0.80 : mva_cmb > 0.70 && mva_cmb < 0.80
    0.80-0.90 : mva_cmb > 0.80 && mva_cmb < 0.90
    0.90-1.00 : mva_cmb > 0.90 && mva_cmb < 0.10
  cmb_test:
    0.10-0.40 : mva_cmb > 0.10 && mva_cmb < 0.40
    0.40-0.70 : mva_cmb > 0.40 && mva_cmb < 0.70
    0.70-1.00 : mva_cmb > 0.70 && mva_cmb < 1.00
fit:
  data_24:
    conf:
      strategy:
        ntries : 10
        pvalue : 0.05
    model:
      pdfs:
        - hypexp 
      shared       : []
      reparametrize: {}
      floating     : []
      fix          :
        mu : 4700
  bpkpjpsiee:
    conf:
      do_errors: False
      strategy:
        ntries : 10
        pvalue : 0.05
    model: null
