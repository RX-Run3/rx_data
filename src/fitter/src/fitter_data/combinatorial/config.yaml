selection:
  leakage : (TMath::Abs(B_const_mass_M - 5280) > 200) && (TMath::Abs(B_const_mass_psi2S_M - 5280) > 100)
  cmb     : (1)
  mass    : (1)
cutflows:
  inv_prc_cmb:
    $BDT_{prc} < 0.10 || BDT_{cmb} < 0.00$ : mva_prc < 0.10 || mva_cmb < 0.00
    $BDT_{prc} < 0.20 || BDT_{cmb} < 0.00$ : mva_prc < 0.20 || mva_cmb < 0.00
    $BDT_{prc} < 0.30 || BDT_{cmb} < 0.00$ : mva_prc < 0.30 || mva_cmb < 0.00
    $BDT_{prc} < 0.40 || BDT_{cmb} < 0.00$ : mva_prc < 0.40 || mva_cmb < 0.00
    $BDT_{prc} < 0.50 || BDT_{cmb} < 0.00$ : mva_prc < 0.50 || mva_cmb < 0.00
    $BDT_{prc} < 0.60 || BDT_{cmb} < 0.00$ : mva_prc < 0.60 || mva_cmb < 0.00
    $BDT_{prc} < 0.70 || BDT_{cmb} < 0.00$ : mva_prc < 0.70 || mva_cmb < 0.00
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.00$ : mva_prc < 0.80 || mva_cmb < 0.00
    # ----------
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.10$ : mva_prc < 0.80 || mva_cmb < 0.10
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.20$ : mva_prc < 0.80 || mva_cmb < 0.20
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.30$ : mva_prc < 0.80 || mva_cmb < 0.30
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.40$ : mva_prc < 0.80 || mva_cmb < 0.40
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.50$ : mva_prc < 0.80 || mva_cmb < 0.50
    $BDT_{prc} < 0.80 || BDT_{cmb} < 0.60$ : mva_prc < 0.80 || mva_cmb < 0.60
  cmb:
    $BDT_{cmb} > 0.00$ : mva_cmb > 0.00
    $BDT_{cmb} > 0.10$ : mva_cmb > 0.10
    $BDT_{cmb} > 0.20$ : mva_cmb > 0.20
    $BDT_{cmb} > 0.30$ : mva_cmb > 0.30
    $BDT_{cmb} > 0.40$ : mva_cmb > 0.40
    $BDT_{cmb} > 0.50$ : mva_cmb > 0.50
    $BDT_{cmb} > 0.60$ : mva_cmb > 0.60
    $BDT_{cmb} > 0.70$ : mva_cmb > 0.70
    $BDT_{cmb} > 0.80$ : mva_cmb > 0.80
    $BDT_{cmb} > 0.85$ : mva_cmb > 0.85
    $BDT_{cmb} > 0.90$ : mva_cmb > 0.90
    $BDT_{cmb} > 0.95$ : mva_cmb > 0.95
  prc:
    $BDT_{prc} > 0.00$ : mva_prc > 0.00
    $BDT_{prc} > 0.10$ : mva_prc > 0.10
    $BDT_{prc} > 0.20$ : mva_prc > 0.20
    $BDT_{prc} > 0.30$ : mva_prc > 0.30
    $BDT_{prc} > 0.40$ : mva_prc > 0.40
    $BDT_{prc} > 0.50$ : mva_prc > 0.50
    $BDT_{prc} > 0.60$ : mva_prc > 0.60
    $BDT_{prc} > 0.70$ : mva_prc > 0.70
    $BDT_{prc} > 0.80$ : mva_prc > 0.80
    $BDT_{prc} > 0.90$ : mva_prc > 0.90
    $BDT_{prc} > 0.95$ : mva_prc > 0.95
  prc_cmb:
    $BDT_{prc} > 0.00 && BDT_{cmb} > 0.00$ : mva_prc > 0.00 && mva_cmb > 0.00
    $BDT_{prc} > 0.10 && BDT_{cmb} > 0.00$ : mva_prc > 0.10 && mva_cmb > 0.00
    $BDT_{prc} > 0.20 && BDT_{cmb} > 0.00$ : mva_prc > 0.20 && mva_cmb > 0.00
    $BDT_{prc} > 0.30 && BDT_{cmb} > 0.00$ : mva_prc > 0.30 && mva_cmb > 0.00
    $BDT_{prc} > 0.40 && BDT_{cmb} > 0.00$ : mva_prc > 0.40 && mva_cmb > 0.00
    $BDT_{prc} > 0.50 && BDT_{cmb} > 0.00$ : mva_prc > 0.50 && mva_cmb > 0.00
    $BDT_{prc} > 0.60 && BDT_{cmb} > 0.00$ : mva_prc > 0.60 && mva_cmb > 0.00
    $BDT_{prc} > 0.70 && BDT_{cmb} > 0.00$ : mva_prc > 0.70 && mva_cmb > 0.00
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.00$ : mva_prc > 0.80 && mva_cmb > 0.00
    # ----------
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.00$ : mva_prc > 0.80 && mva_cmb > 0.00
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.10$ : mva_prc > 0.80 && mva_cmb > 0.10
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.20$ : mva_prc > 0.80 && mva_cmb > 0.20
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.30$ : mva_prc > 0.80 && mva_cmb > 0.30
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.40$ : mva_prc > 0.80 && mva_cmb > 0.40
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.50$ : mva_prc > 0.80 && mva_cmb > 0.50
    $BDT_{prc} > 0.80 && BDT_{cmb} > 0.60$ : mva_prc > 0.80 && mva_cmb > 0.60
  cmb_prc:
    $BDT_{cmb} > 0.00 && BDT_{prc} > 0.00$ : mva_cmb > 0.00 && mva_prc > 0.00
    $BDT_{cmb} > 0.10 && BDT_{prc} > 0.00$ : mva_cmb > 0.10 && mva_prc > 0.00
    $BDT_{cmb} > 0.20 && BDT_{prc} > 0.00$ : mva_cmb > 0.20 && mva_prc > 0.00
    $BDT_{cmb} > 0.30 && BDT_{prc} > 0.00$ : mva_cmb > 0.30 && mva_prc > 0.00
    $BDT_{cmb} > 0.40 && BDT_{prc} > 0.00$ : mva_cmb > 0.40 && mva_prc > 0.00
    $BDT_{cmb} > 0.50 && BDT_{prc} > 0.00$ : mva_cmb > 0.50 && mva_prc > 0.00
    $BDT_{cmb} > 0.60 && BDT_{prc} > 0.00$ : mva_cmb > 0.60 && mva_prc > 0.00
    $BDT_{cmb} > 0.70 && BDT_{prc} > 0.00$ : mva_cmb > 0.70 && mva_prc > 0.00
    $BDT_{cmb} > 0.80 && BDT_{prc} > 0.00$ : mva_cmb > 0.80 && mva_prc > 0.00
    $BDT_{cmb} > 0.90 && BDT_{prc} > 0.00$ : mva_cmb > 0.90 && mva_prc > 0.00
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.00$ : mva_cmb > 0.95 && mva_prc > 0.00
    # ---------------
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.10$ : mva_cmb > 0.95 && mva_prc > 0.10
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.20$ : mva_cmb > 0.95 && mva_prc > 0.20
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.30$ : mva_cmb > 0.95 && mva_prc > 0.30
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.40$ : mva_cmb > 0.95 && mva_prc > 0.40
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.50$ : mva_cmb > 0.95 && mva_prc > 0.50
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.60$ : mva_cmb > 0.95 && mva_prc > 0.60
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.70$ : mva_cmb > 0.95 && mva_prc > 0.70
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.80$ : mva_cmb > 0.95 && mva_prc > 0.80
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.90$ : mva_cmb > 0.95 && mva_prc > 0.90
    $BDT_{cmb} > 0.95 && BDT_{prc} > 0.95$ : mva_cmb > 0.95 && mva_prc > 0.95
  cmb_window:
    $BDT_{cmb} > 0.00 && BDT_{cmb} < 0.80$ : mva_cmb > 0.00 && mva_cmb < 0.8
    $BDT_{cmb} > 0.10 && BDT_{cmb} < 0.80$ : mva_cmb > 0.10 && mva_cmb < 0.8
    $BDT_{cmb} > 0.20 && BDT_{cmb} < 0.80$ : mva_cmb > 0.20 && mva_cmb < 0.8
    $BDT_{cmb} > 0.30 && BDT_{cmb} < 0.80$ : mva_cmb > 0.30 && mva_cmb < 0.8
    $BDT_{cmb} > 0.40 && BDT_{cmb} < 0.80$ : mva_cmb > 0.40 && mva_cmb < 0.8
    $BDT_{cmb} > 0.50 && BDT_{cmb} < 0.80$ : mva_cmb > 0.50 && mva_cmb < 0.8
  cmb_prc_window:
    $(BDT_{prc} > 0.10 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.10 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.20 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.20 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.30 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.30 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.40 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.40 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.50 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.50 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.60 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.60 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.70 and BDT_{cmb} > 0.20) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.70 && mva_cmb > 0.20) && (mva_prc < 0.80 || mva_cmb < 0.6)
    # ----------
    $(BDT_{prc} > 0.70 and BDT_{cmb} > 0.30) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.70 && mva_cmb > 0.30) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.70 and BDT_{cmb} > 0.40) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.70 && mva_cmb > 0.40) && (mva_prc < 0.80 || mva_cmb < 0.6)
    $(BDT_{prc} > 0.70 and BDT_{cmb} > 0.50) and (BDT_{prc} < 0.80 || BDT_{cmb} < 0.60)$ : (mva_prc > 0.70 && mva_cmb > 0.50) && (mva_prc < 0.80 || mva_cmb < 0.6)
fits:
  strategy:
    ntries : 10
    pvalue : 0.05
  model:
    pdfs:
      - exp
    shared       : []
    reparametrize: {}
    fix          : {}
    floating     : []
