style : &style
  xrotation : 45
  alpha     : 0.5
  color     : blue
# ------------------------
out_dir : /tmp/cmb
size    : [15, 10]
xname   : Fit
styles  :
  mu_hypexp_cmb_1:
    <<: *style
    ylabel: $\mu$
    color : blue
    yrange: [4000, 7000]
  ap_hypexp_cmb_1:
    <<: *style
    ylabel: $\alpha$
    color : blue
    yrange: [0., 0.010]
  bt_hypexp_cmb_1:
    <<: *style
    ylabel: $\beta$
    color : blue
    yrange: [0., 0.003]
labels :
  mu_hypexp_cmb_1 : SS
  ap_hypexp_cmb_1 : SS
  bt_hypexp_cmb_1 : SS
groups :
  mu_hypexp_cmb_1 :
    - mu_hypexp_cmb_1
  ap_hypexp_cmb_1 :
    - ap_hypexp_cmb_1
  bt_hypexp_cmb_1 :
    - bt_hypexp_cmb_1
