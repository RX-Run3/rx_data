# This is a config file used for tests
# It illustrates how a fit would run for data
reg_cfg_jpsi: &reg_cfg_jpsi
  nbins           : 325 
  stacked         : True
  d_leg :
    ccbar_brem_x12         : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx1         : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx2         : $B_{s,d,u}\to c\bar{c} X$
    comb_brem_xx1          : Combinatorial
    comb_brem_xx2          : Combinatorial
    bskstjpsiee_brem_xx1   : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bskstjpsiee_brem_xx2   : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bdkstkpijpsiee_brem_xx1: $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpijpsiee_brem_xx2: $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bskstjpsiee            : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bdkstkpijpsiee         : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
  plot_components : 
    - ccbar_brem_xx1
    - ccbar_brem_xx2
    - ccbar_brem_x12
  plot_range :
    - 4900
    - 6200
reg_cfg_psi2: &reg_cfg_psi2
  nbins           : 40 
  stacked         : True
  d_leg :
    ccbar                        : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx1               : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx2               : $B_{s,d,u}\to c\bar{c} X$
    comb                         : Combinatorial
    comb_brem_xx1                : Combinatorial
    comb_brem_xx2                : Combinatorial
    comb_brem_x12                : Combinatorial
    lbpkjpsiee                   : $\Lambda_b \to J/\psi pK$
    lbpkjpsiee_brem_xx1          : $\Lambda_b \to J/\psi pK$
    lbpkjpsiee_brem_xx2          : $\Lambda_b \to J/\psi pK$
    lbpkjpsiee_brem_x12          : $\Lambda_b \to J/\psi pK$
    bsphijpsiee                  : $B_s \to J/\psi\phi(\to KK)$
    bsphijpsiee_brem_xx1         : $B_s \to J/\psi\phi(\to KK)$
    bsphijpsiee_brem_xx2         : $B_s \to J/\psi\phi(\to KK)$
    bsphijpsiee_brem_x12         : $B_s \to J/\psi\phi(\to KK)$
    bskstjpsiee                  : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bskstjpsiee_brem_xx1         : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bskstjpsiee_brem_xx2         : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bskstjpsiee_brem_x12         : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bdkstjpsiee                  : $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$ 
    bdkstkpijpsiee_had_swp_brem_xx1 : $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$ 
    bdkstkpijpsiee_had_swp_brem_xx2 : $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$ 
    bdkstkpijpsiee_had_swp_brem_x12 : $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$ 
    bdkstkpijpsiee               : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpijpsiee_brem_xx1      : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpijpsiee_brem_xx2      : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpijpsiee_brem_x12      : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpipsi2ee               : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bdkstkpipsi2ee_brem_xx1      : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bdkstkpipsi2ee_brem_xx2      : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bdkstkpipsi2ee_brem_x12      : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bskstpsi2ee                  : $B_s\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bskstpsi2ee_brem_xx1         : $B_s\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bskstpsi2ee_brem_xx2         : $B_s\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
    bskstpsi2ee_brem_x12         : $B_s\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
  plot_components : 
    - ccbar
  plot_range :
    - 4900
    - 6200
# ----------------------------------
trigger   : rkst_ee_os
yields    : model/yields/rkst/reso_electron.yaml
selection :
  jpsi : {}
  psi2 : {}
observable:
  jpsi:
    name : B_const_mass_M
    range:
      - 4700 
      - 7000
  psi2:
    name : B_const_mass_psi2S_M
    range:
      - 4700 
      - 7000
components:
  jpsi:
    comb                : reso/rkst/ee/comb.yaml
    ccbar               : reso/rkst/ee/ccbar.yaml
    lbpkjpsiee          : reso/rkst/ee/lbpkjpsiee_np.yaml
    bsphijpsiee         : reso/rkst/ee/bsphijpsiee_np.yaml
    bskstjpsiee         : reso/rkst/ee/bskstjpsiee.yaml
    bdkstkpijpsiee_had_swp : reso/rkst/ee/bdkstkpijpsiee_had_swp_np.yaml
    bdkstkpijpsiee      : reso/rkst/ee/bdkstkpijpsiee.yaml
    bdkstkpipsi2ee      : reso/rkst/ee/bdkstkpipsi2ee_np.yaml
  psi2:
    comb                : reso/rkst/ee/comb.yaml
    ccbar               : reso/rkst/ee/ccbar.yaml
    lbpkjpsiee          : reso/rkst/ee/lbpkjpsiee_np.yaml
    bsphijpsiee         : reso/rkst/ee/bsphijpsiee_np.yaml
    bdkstkpijpsiee_had_swp : reso/rkst/ee/bdkstkpijpsiee_had_swp_np.yaml
    bskstjpsiee         : reso/rkst/ee/bskstjpsiee_psi2.yaml
    bskstpsi2ee         : reso/rkst/ee/bskstpsi2ee.yaml
    bdkstkpijpsiee      : reso/rkst/ee/bdkstkpijpsiee_psi2.yaml
    bdkstkpipsi2ee      : reso/rkst/ee/bdkstkpipsi2ee.yaml
constraints:
  signal_fraction:
    - bskstjpsiee 
    - bsphijpsiee
    - lbpkjpsiee
    - bdkstkpijpsiee_had_swp
  combinatorial   : false
  signal_shape    : false
fit: {}
plots:
  jpsi :
    merging :
      brem_x12-rkst_ee_os:
        - brem_xx1-rkst_ee_os
        - brem_xx2-rkst_ee_os
    regions :
      brem_xx1-rkst_ee_os : *reg_cfg_jpsi
      brem_xx2-rkst_ee_os : *reg_cfg_jpsi
      brem_x12-rkst_ee_os : *reg_cfg_jpsi
  psi2 :
    merging :
      brem_x12-rkst_ee_os:
        - brem_xx1-rkst_ee_os
        - brem_xx2-rkst_ee_os
    regions :
      brem_xx1-rkst_ee_os : *reg_cfg_psi2
      brem_xx2-rkst_ee_os : *reg_cfg_psi2
      brem_x12-rkst_ee_os : *reg_cfg_psi2
