# This is a config file used for tests
# It illustrates how a fit would run for data

trigger   : rkst_ee_os
yields    : model/yields/rkst/reso_electron.yaml
selection : 
  extra   : TMath::Abs(B_const_mass_M) > 5180
observable:
  jpsi:
    name : B_Mass
    range:
      - 4500 
      - 7000
  psi2:
    name : B_Mass 
    range:
      - 4500 
      - 7000
components:
  comb            : reso/rkst/ee/comb.yaml
  ccbar           : reso/rkst/ee/ccbar.yaml
  lbpkjpsiee      : reso/rkst/ee/lbpkjpsiee_np.yaml
  bsphijpsiee     : reso/rkst/ee/bsphijpsiee_np.yaml
  #bskstjpsiee     : reso/rkst/ee/bskstjpsiee.yaml
  bdkstkpijpsiee_had_swp : reso/rkst/ee/bdkstkpijpsiee_had_swp_np.yaml
  bdkstkpijpsiee  : reso/rkst/ee/bdkstkpijpsiee.yaml
  bdkstkpipsi2ee  : reso/rkst/ee/bdkstkpipsi2ee.yaml
constraints:
  signal_fraction: []
fit: {}
plots: # These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
  nbins     : 50
  stacked   : True
  d_leg :
    comb            : Combinatorial
    ccbar           : $B_{s,d,u}\to c\bar{c} X$
    lbjpsipkee      : $\Lambda_b \to J/\psi pK$
    bsphijpsiee     : $B_s \to J/\psi\phi(\to KK)$
    bskstjpsiee     : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
    bdkstkpijpsiee_had_swp : $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$ 
    bdkstkpijpsiee  : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$ 
    bdkstkpipsi2ee  : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$ 
