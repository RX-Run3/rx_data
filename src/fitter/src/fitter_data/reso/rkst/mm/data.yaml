# These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
plt_cfg: &plt_cfg
  merging : {}
  regions :
    brem_xx0-rkst_mm_os:
      nbins   : 210
      stacked : True
      d_leg :
        comb_brem_xx0               : Combinatorial
        ccbar_brem_xx0              : $B_{s,d,u}\to c\bar{c} X$
        lbpkjpsimm_brem_xx0         : $\Lambda_b \to J/\psi pK$
        bsphijpsimm_brem_xx0        : $B_s \to J/\psi\phi(\to KK)$
        bskstjpsimm_brem_xx0        : $B_s\to J/\psi K^{*0}(\to K^+\pi^-)$
        bskstpsi2mm_brem_xx0        : $B_s\to \psi(2S) K^{*0}(\to K^+\pi^-)$
        bdkstkpijpsimm_brem_xx0     : $B^0\to J/\psi K^{*0}(\to K^+\pi^-)$
        bdkstjpsimm_had_swp_brem_xx0: $B^0\to J/\psi K^{*0}(\to K^+_{\to\pi^+}\pi^-_{\to K^-})$
        bdkstkpipsi2mm_brem_xx0     : $B^0\to \psi(2S) K^{*0}(\to K^+\pi^-)$
      plot_range:
        - 5180
        - 5600
      plot_components: []
# ----------------------------------------------
trigger   : rkst_mm_os
yields    : model/yields/rkst/reso_muon.yaml
selection :
  jpsi : {} 
  psi2 : {} 
observable:
  jpsi:
    name : B_const_mass_M
    range:
      - 4700
      - 7000
  psi2:
    name : B_const_mass_psi2S_M
    range:
      - 4700
      - 7000
components:
  jpsi:
    comb                  : reso/rkst/mm/comb.yaml
    ccbar                 : reso/rkst/mm/ccbar.yaml
    lbpkjpsimm            : reso/rkst/mm/lbpkjpsimm_np.yaml
    bsphijpsimm           : reso/rkst/mm/bsphijpsimm_np.yaml
    bskstjpsimm           : reso/rkst/mm/bskstjpsimm.yaml
    bdkstjpsimm_had_swp   : reso/rkst/mm/bdkstjpsimm_had_swp_np.yaml
    bdkstkpijpsimm        : reso/rkst/mm/bdkstkpijpsimm.yaml
  psi2:
    comb                  : reso/rkst/mm/comb.yaml
    ccbar                 : reso/rkst/mm/ccbar.yaml
    bskstpsi2mm           : reso/rkst/mm/bskstpsi2mm.yaml
    # bdkstpsi2mm_had_swp : reso/rkst/mm/bdkstjpsimm_had_swp_np.yaml
    bdkstkpipsi2mm        : reso/rkst/mm/bdkstkpipsi2mm.yaml
constraints:
  signal_fraction:
    - lbpkjpsimm
    - bsphijpsimm
    - bskstjpsimm
    - bdkstjpsimm_had_swp
    # --------------------
    - bskstpsi2mm
    # - bdkstpsi2mm_had_swp
  combinatorial   : false
  signal_shape    : false
fit: {}
plots: 
  jpsi : *plt_cfg
  psi2 : *plt_cfg
