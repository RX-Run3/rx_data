# This is a config file used for tests
# It illustrates how a fit would run for data
trigger          : rk_mm_os
yields           : model/yields/rk/reso_muon.yaml
selection        :
  jpsi : {}
  psi2 : {}
observable:
  jpsi:
    name : B_const_mass_M
    range:
      - 5180
      - 6500
  psi2:
    name : B_const_mass_psi2S_M
    range:
      - 5180
      - 6000
components:
  jpsi:
    comb       : reso/rk/mm/comb.yaml
    bppijpsimm : reso/rk/mm/bppijpsimm.yaml
    bpkpjpsimm : reso/rk/mm/bpkpjpsimm.yaml
  psi2:
    comb       : reso/rk/mm/comb.yaml
    bpkppsi2mm : reso/rk/mm/bpkppsi2mm.yaml
constraints:
  signal_fraction:
    - bppijpsimm
  combinatorial   : false
  signal_shape    : false
fit: {}
plots: # These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
  jpsi:
    merging : {}
    regions :
      brem_xx0-rk_mm_os:
        nbins           : 400
        stacked         : True
        d_leg :
          bpkpjpsimm_brem_xx0 : $B^+\to J/\psi(\to \mu^+\mu^-) K^+$
          bppijpsimm_brem_xx0 : $B^+\to J/\psi(\to \mu^+\mu^-) \pi^+$
          bpkppsi2mm_brem_xx0 : $B^+\to \psi(2S)(\to \mu^+\mu^-) K^+$
          comb_brem_xx0       : Combinatorial
        plot_range:
          - 5180
          - 6000
        plot_components:
          - ccbar
  psi2:
    merging : {}
    regions :
      brem_xx0-rk_mm_os:
        nbins           : 80
        stacked         : True
        d_leg :
          bpkpjpsimm_brem_xx0 : $B^+\to J/\psi(\to \mu^+\mu^-) K^+$
          bppijpsimm_brem_xx0 : $B^+\to J/\psi(\to \mu^+\mu^-) \pi^+$
          bpkppsi2mm_brem_xx0 : $B^+\to \psi(2S)(\to \mu^+\mu^-) K^+$
          comb_brem_xx0       : Combinatorial
        plot_range:
          - 5180
          - 5700
        plot_components:
          - ccbar
