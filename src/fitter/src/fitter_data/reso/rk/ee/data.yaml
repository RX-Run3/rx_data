plots_settings: &plots_settings_jpsi
  nbins           : 400
  stacked         : True
  d_leg :
    ccbar               : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx1      : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx2      : $B_{s,d,u}\to c\bar{c} X$
    comb                : Combinatorial
    comb_brem_xx1       : Combinatorial
    comb_brem_xx2       : Combinatorial
    bppijpsiee_brem_xx1 : $B^+\to J/\psi(\to e^+e^-)\pi^+$
    bppijpsiee_brem_xx2 : $B^+\to J/\psi(\to e^+e^-)\pi^+$
    # ---------
    bpkpjpsiee          : $B^+\to J/\psi(\to e^+e^-) K^+$
    bpkpjpsiee_brem_xx1 : $B^+\to J/\psi(\to e^+e^-) K^+$
    bpkpjpsiee_brem_xx2 : $B^+\to J/\psi(\to e^+e^-) K^+$
    # ---------
    bpkppsi2ee          : $B^+\to \psi(2S)(\to e^+e^-) K^+$
    bpkppsi2ee_brem_xx1 : $B^+\to \psi(2S)(\to e^+e^-) K^+$
    bpkppsi2ee_brem_xx2 : $B^+\to \psi(2S)(\to e^+e^-) K^+$
  plot_components : []
  plot_range:
    - 4800
    - 6100
# ------------------------------
plots_settings: &plots_settings_psi2
  nbins           : 80
  stacked         : True
  d_leg :
    comb                : Combinatorial
    comb_brem_xx1       : Combinatorial
    comb_brem_xx2       : Combinatorial
    ccbar               : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx1      : $B_{s,d,u}\to c\bar{c} X$
    ccbar_brem_xx2      : $B_{s,d,u}\to c\bar{c} X$
    bppijpsiee_brem_xx1 : $B^+\to J/\psi(\to e^+e^-)\pi^+$
    bppijpsiee_brem_xx2 : $B^+\to J/\psi(\to e^+e^-)\pi^+$
    # ---------
    bpkpjpsiee          : $B^+\to J/\psi(\to e^+e^-) K^+$
    bpkpjpsiee_brem_xx1 : $B^+\to J/\psi(\to e^+e^-) K^+$
    bpkpjpsiee_brem_xx2 : $B^+\to J/\psi(\to e^+e^-) K^+$
    # ---------
    bpkppsi2ee          : $B^+\to \psi(2S)(\to e^+e^-) K^+$
    bpkppsi2ee_brem_xx1 : $B^+\to \psi(2S)(\to e^+e^-) K^+$
    bpkppsi2ee_brem_xx2 : $B^+\to \psi(2S)(\to e^+e^-) K^+$
  plot_components :
    - ccbar_brem_xx1
    - ccbar_brem_xx2
  plot_range:
    - 4800
    - 6100
# ------------------------------
trigger   : rk_ee_os
yields    : model/yields/rk/reso_electron.yaml
selection :
  jpsi : {}
  psi2 : {}
observable:
  jpsi:
    name : bp_dtf_jpsi
    range:
      - 4800
      - 7000
  psi2:
    name : bp_dtf_psi2
    range:
      - 4800
      - 7000
components:
  jpsi:
    comb       : reso/rk/ee/comb.yaml
    bppijpsiee : reso/rk/ee/bppijpsiee.yaml
    ccbar      : reso/rk/ee/ccbar.yaml
    bpkpjpsiee : reso/rk/ee/bpkpjpsiee.yaml
  psi2:
    comb       : reso/rk/ee/comb.yaml
    ccbar      : reso/rk/ee/ccbar.yaml
    bpkpjpsiee : reso/rk/ee/bpkpjpsiee_psi2.yaml
    bpkppsi2ee : reso/rk/ee/bpkppsi2ee.yaml
constraints:
  signal_fraction:
    - bppijpsiee
  combinatorial   : false
  signal_shape    : false
fit: {}
plots:
  jpsi:
    merging:
      brem_x12-rk_ee_os:
        - brem_xx1-rk_ee_os
        - brem_xx2-rk_ee_os
    regions:
      brem_xx1-rk_ee_os : *plots_settings_jpsi
      brem_xx2-rk_ee_os : *plots_settings_jpsi
      brem_x12-rk_ee_os : *plots_settings_jpsi
  psi2:
    merging:
      brem_x12-rk_ee_os:
        - brem_xx1-rk_ee_os
        - brem_xx2-rk_ee_os
    regions:
      brem_xx1-rk_ee_os : *plots_settings_psi2
      brem_xx2-rk_ee_os : *plots_settings_psi2
      brem_x12-rk_ee_os : *plots_settings_psi2
