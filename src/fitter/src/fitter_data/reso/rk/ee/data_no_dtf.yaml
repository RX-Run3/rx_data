plots_settings: &plots_settings
  nbins    : 50
  stacked  : True
  d_leg :
    bpkpjpsiee_brem_xx1 : $B^+\to K^+J/\psi(\to e^+e^-); 1\gamma$
    bpkpjpsiee_brem_xx2 : $B^+\to K^+J/\psi(\to e^+e^-); 2\gamma$
  plot_components : []
  plot_range:
    - 4500
    - 7000
# -------------------------------------
trigger   : rk_ee_os
yields    : model/yields/rk/reso_electron.yaml
selection :
  jpsi :
    extra   : TMath::Abs(B_const_mass_M) > 5200
    q2      : (q2_dtf > 6000000) && (q2_dtf < 11000000)
observable:
  jpsi:
    name : B_Mass
    range:
      - 4500
      - 7000
components:
  jpsi:
    #comb       : reso/rk/ee/comb_no_dtf.yaml
    #bppijpsiee : reso/rk/ee/bppijpsiee.yaml
    #ccbar      : reso/rk/ee/ccbar.yaml
    bpkpjpsiee : reso/rk/ee/bpkpjpsiee_no_dtf.yaml
    #bpkppsi2ee : reso/rk/ee/bpkppsi2ee.yaml
constraints:
  signal_fraction : []
  combinatorial : false
  signal_shape  : false
fit: {}
plots:
  jpsi:
    merging : {}
    regions :
      brem_xx1-rk_ee_os : *plots_settings
      brem_xx2-rk_ee_os : *plots_settings
