# This config file defines the yields and the relationships between them
# For the fit of the resonant muon channel 
yields: &yields
  val : 10
  min : 0
  max : 1000000
# -------------------------
s_bppijpsimm_brem_xx0:
  - 0.0
  - 1.0
# -------------------------
yld_bppijpsimm_brem_xx0:
  kind : mul
  pars :
    - s_bppijpsimm_brem_xx0
    - yld_bpkpjpsimm_brem_xx0
# -------------------------
yld_comb_brem_xx0:
  <<: *yields
yld_bpkpjpsimm_brem_xx0:
  <<: *yields
yld_bpkppsi2mm_brem_xx0:
  <<: *yields
# -------------------------
