# This config file defines the yields and the relationships between them
# For the fit of the resonant muon channel
yields: &yields
  val : 10
  min : 0
  max : 1000000
# -------------------------
s_bppijpsimm_brem_xx0:
  val : 0.5
  min : 0.0
  max : 1.0
# -------------------------
yld_bppijpsimm_rk_brem_xx0:
  kind : mul
  pars :
    - s_bppijpsimm_brem_xx0
    - yld_bpkpjpsimm_rk_brem_xx0
# -------------------------
yld_comb_rk_brem_xx0:
  <<: *yields
yld_bpkpjpsimm_rk_brem_xx0:
  <<: *yields
yld_bpkppsi2mm_rk_brem_xx0:
  <<: *yields
yld_ccbar_rk_brem_xx0:
  <<: *yields
# -------------------------
