# This config file defines the yields and the relationships between them
# For the fit of the resonant muon channel when done simultaneously with
# the electron channel
yields: &yields
  val : 10
  min : 0
  max : 1000000
rk:
  val : 1
  min : 0
  max : 2
yld_bpkpee_brem_x12:
  <<      : *yields
yld_bpkpmm_brem_xx0:
  kind : mul
  pars :
    - yld_bpkpee_brem_x12
    - rk
yld_comb_brem_xx0:
  <<: *yields
