# This config file defines the yields and the relationships between them
# For the fit of the rare muon channel simultaneously with the electron one
yields: &yields
  val : 10
  min : 0
  max : 1000000
rkst:
  val :  1
  min :  0
  max : 10
yld_bdkstkpimm_rkst_brem_xx0:
  kind : mul
  pars :
    - yld_bdkstkpiee_rkst_brem_x12
    - rkst
yld_comb_rkst_brem_xx0:
  <<: *yields
