# This config file defines the yields and the relationships between them
# For the fit of the resonant electron channel 
yields: &yields
  val : 10
  min : 0
  max : 1000000
jpsi_fraction:
  val : 0.5
  min : 0.0
  max : 1.0 
psi2_fraction:
  val : 0.5
  min : 0.0
  max : 1.0 
# -------------------------
yld_bdkstkpijpsiee_brem_xx1:
  kind: mul
  pars: 
    - yld_bdkstkpijpsiee
    - jpsi_fraction
yld_bdkstkpijpsiee_brem_xx2:
  kind: dif 
  pars:
    - yld_bdkstkpijpsiee
    - yld_bdkstkpijpsiee_brem_xx1
# -------------------------
yld_bdkstkpipsi2ee_brem_xx1:
  kind: mul
  pars: 
    - yld_bdkstkpipsi2ee
    - psi2_fraction
yld_bdkstkpipsi2ee_brem_xx2:
  kind: dif 
  pars:
    - yld_bdkstkpipsi2ee
    - yld_bdkstkpipsi2ee_brem_xx1 
# -------------------------
yld_bdkstjpsiee_swp_brem_xx1:
  <<: *yields
yld_bdkstjpsiee_swp_brem_xx2:
  <<: *yields
yld_lbpkjpsiee_brem_xx1:
  <<: *yields
yld_lbpkjpsiee_brem_xx2:
  <<: *yields
yld_bsphijpsiee_brem_xx1:
  <<: *yields
yld_bsphijpsiee_brem_xx2:
  <<: *yields
yld_bskstjpsiee_brem_xx1:
  <<: *yields
yld_bskstjpsiee_brem_xx2:
  <<: *yields
yld_comb_brem_xx1:
  <<: *yields
yld_comb_brem_xx2:
  <<: *yields
yld_bdkstkpijpsiee_brem_xx1:
  <<: *yields
yld_bdkstkpijpsiee_brem_xx2:
  <<: *yields
yld_bdkstkpipsi2ee_brem_xx1:
  <<: *yields
yld_bdkstkpipsi2ee_brem_xx2:
  <<: *yields
yld_ccbar_brem_xx1:
  <<: *yields
yld_ccbar_brem_xx2:
  <<: *yields
