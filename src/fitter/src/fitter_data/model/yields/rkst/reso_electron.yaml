# This config file defines the yields and the relationships between them
# For the fit of the resonant electron channel 
# --------------------
# Generic parameters
# --------------------
fractions: &fractions
  val : 0.5 
  min : 0.0
  max : 1.0 
yields: &yields
  val : 10
  min : 0
  max : 1000000
# -------------------------
# Total signals
# -------------------------
yld_bdkstkpijpsiee:
  <<: *yields
yld_bdkstkpipsi2ee:
  <<: *yields
# --------------------
# Signal brem fractions
# -------------------------
bdkstkpijpsiee_fraction:
  <<: *fractions
bdkstkpipsi2ee_fraction:
  <<: *fractions
# -------------------------
# Signals by brem
# -------------------------
yld_bdkstkpijpsiee_rkst_brem_xx1:
  kind: mul
  pars: 
    - yld_bdkstkpijpsiee
    - bdkstkpijpsiee_fraction
yld_bdkstkpijpsiee_rkst_brem_xx2:
  kind: dif 
  pars:
    - yld_bdkstkpijpsiee
    - yld_bdkstkpijpsiee_rkst_brem_xx1
yld_bdkstkpipsi2ee_rkst_brem_xx1:
  kind: mul
  pars: 
    - yld_bdkstkpipsi2ee
    - bdkstkpipsi2ee_fraction
yld_bdkstkpipsi2ee_rkst_brem_xx2:
  kind: dif 
  pars:
    - yld_bdkstkpipsi2ee
    - yld_bdkstkpipsi2ee_rkst_brem_xx1 
# -------------------------
# J/psi scales
# -------------------------
s_bdkstjpsiee_had_swp_brem_xx1:
  <<: *fractions
s_bdkstjpsiee_had_swp_brem_xx2:
  <<: *fractions
s_lbpkjpsiee_brem_xx1:
  <<: *fractions
s_lbpkjpsiee_brem_xx2:
  <<: *fractions
s_bsphijpsiee_brem_xx1:
  <<: *fractions
s_bsphijpsiee_brem_xx2:
  <<: *fractions
s_bskstjpsiee_brem_xx1:
  <<: *fractions
s_bskstjpsiee_brem_xx2:
  <<: *fractions
# -------------------------
# psi(2S) scales
# -------------------------
s_bdkstpsi2ee_had_swp_brem_xx1:
  <<: *fractions
s_bdkstpsi2ee_had_swp_brem_xx2:
  <<: *fractions
s_lbpkpsi2ee_brem_xx1:
  <<: *fractions
s_lbpkpsi2ee_brem_xx2:
  <<: *fractions
s_bsphipsi2ee_brem_xx1:
  <<: *fractions
s_bsphipsi2ee_brem_xx2:
  <<: *fractions
s_bskstpsi2ee_brem_xx1:
  <<: *fractions
s_bskstpsi2ee_brem_xx2:
  <<: *fractions
# -------------------------
# J/Psi backgrounds
# -------------------------
yld_bdkstjpsiee_rkst_had_swp_brem_xx1:
  kind: mul
  pars:
    -  s_bdkstjpsiee_had_swp_brem_xx1
    - yld_bdkstkpijpsiee_rkst_brem_xx1
yld_bdkstjpsiee_rkst_had_swp_brem_xx2:
  kind: mul
  pars:
    -  s_bdkstjpsiee_had_swp_brem_xx2
    - yld_bdkstkpijpsiee_rkst_brem_xx2
yld_lbpkjpsiee_rkst_brem_xx1:
  kind: mul
  pars:
    -       s_lbpkjpsiee_brem_xx1
    - yld_bdkstkpijpsiee_rkst_brem_xx1
yld_lbpkjpsiee_rkst_brem_xx2:
  kind: mul
  pars:
    -       s_lbpkjpsiee_brem_xx2
    - yld_bdkstkpijpsiee_rkst_brem_xx2
yld_bsphijpsiee_rkst_brem_xx1:
  kind: mul
  pars:
    -      s_bsphijpsiee_brem_xx1
    - yld_bdkstkpijpsiee_rkst_brem_xx1
yld_bsphijpsiee_rkst_brem_xx2:
  kind: mul
  pars:
    -      s_bsphijpsiee_brem_xx2
    - yld_bdkstkpijpsiee_rkst_brem_xx2
yld_bskstjpsiee_rkst_brem_xx1:
  kind: mul
  pars:
    -      s_bskstjpsiee_brem_xx1
    - yld_bdkstkpijpsiee_rkst_brem_xx1
yld_bskstjpsiee_rkst_brem_xx2:
  kind: mul
  pars:
    -      s_bskstjpsiee_brem_xx2
    - yld_bdkstkpijpsiee_rkst_brem_xx2
# -------------------------
# Psi(2S) backgrounds
# -------------------------
yld_bdkstpsi2ee_rkst_had_swp_brem_xx1:
  kind: mul
  pars:
    -  s_bdkstpsi2ee_had_swp_brem_xx1
    - yld_bdkstkpipsi2ee_rkst_brem_xx1
yld_bdkstpsi2ee_rkst_had_swp_brem_xx2:
  kind: mul
  pars:
    -  s_bdkstpsi2ee_had_swp_brem_xx2
    - yld_bdkstkpipsi2ee_rkst_brem_xx2
yld_lbpkpsi2ee_rkst_brem_xx1:
  kind: mul
  pars:
    -       s_lbpkpsi2ee_brem_xx1
    - yld_bdkstkpipsi2ee_rkst_brem_xx1
yld_lbpkpsi2ee_rkst_brem_xx2:
  kind: mul
  pars:
    -       s_lbpkpsi2ee_brem_xx2
    - yld_bdkstkpipsi2ee_rkst_brem_xx2
yld_bsphipsi2ee_rkst_brem_xx1:
  kind: mul
  pars:
    -      s_bsphipsi2ee_brem_xx1
    - yld_bdkstkpipsi2ee_rkst_brem_xx1
yld_bsphipsi2ee_rkst_brem_xx2:
  kind: mul
  pars:
    -      s_bsphipsi2ee_brem_xx2
    - yld_bdkstkpipsi2ee_rkst_brem_xx2
yld_bskstpsi2ee_rkst_brem_xx1:
  kind: mul
  pars:
    -      s_bskstpsi2ee_brem_xx1
    - yld_bdkstkpipsi2ee_rkst_brem_xx1
yld_bskstpsi2ee_rkst_brem_xx2:
  kind: mul
  pars:
    -      s_bskstpsi2ee_brem_xx2
    - yld_bdkstkpipsi2ee_rkst_brem_xx2
# -------------------------
# Shared backgrounds
# -------------------------
yld_ccbar_rkst_brem_xx1:
  <<: *yields
yld_ccbar_rkst_brem_xx2:
  <<: *yields
yld_comb_rkst_brem_xx1:
  <<: *yields
yld_comb_rkst_brem_xx2:
  <<: *yields
