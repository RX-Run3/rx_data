# This config file defines the yields and the relationships between them
# For the fit of the rare electron channel
# --------------------
fractions: &fractions
  val : 0.5
  min : 0.0
  max : 1.0
# --------------------
yields: &yields
  val : 10
  min : 0
  max : 100000
# --------------------
eff_kst_k:
  val : 0.5
  min : 0.0
  max : 1.0
# --------------------
# Signal yield
# --------------------
yld_bdkstkpiee_rkst_brem_x12:
  kind : mul
  pars :
    - yld_bpkpee_rk_brem_x12
    - eff_kst_k
bdkstkpiee_fraction:
  <<      : *fractions
yld_bdkstkpiee_rkst_brem_xx1:
  kind : mul
  pars :
    - bdkstkpiee_fraction
    - yld_bdkstkpiee
yld_bdkstkpiee_rkst_brem_xx2:
  kind : dif
  pars :
    - yld_bdkstkpiee
    - yld_bdkstkpiee_brem_xx1
# --------------------
# Unconstrained background yields
# --------------------
yld_ccbar_rkst_brem_x12:
  <<      : *yields
yld_bpkpipiee_rkst_brem_x12:
  <<      : *yields
yld_bpk1kpipiee_rkst_brem_x12:
  <<      : *yields
yld_bpk2kpipiee_rkst_brem_x12:
  <<      : *yields
yld_bpkxkpipiee_rkst_brem_x12:
  <<      : *yields
yld_comb_rkst_brem_x12:
  <<      : *yields
yld_bdkstkpijpsiee_rkst_brem_x12:
  <<      : *yields
yld_bdkstkpipsi2ee_rkst_brem_x12:
  <<      : *yields
yld_bppsi2ee_rkst_brem_x12:
  <<      : *yields
# --------------------
yld_ccbar_rkst_brem_xx1:
  <<      : *yields
yld_bpkpipiee_rkst_brem_xx1:
  <<      : *yields
yld_bpk1kpipiee_rkst_brem_xx1:
  <<      : *yields
yld_bpk2kpipiee_rkst_brem_xx1:
  <<      : *yields
yld_bpkxkpipiee_rkst_brem_xx1:
  <<      : *yields
yld_comb_rkst_brem_xx1:
  <<      : *yields
yld_bdkstkpijpsiee_rkst_brem_xx1:
  <<      : *yields
yld_bdkstkpipsi2ee_rkst_brem_xx1:
  <<      : *yields
yld_bppsi2ee_rkst_brem_xx1:
  <<      : *yields
# --------------------
yld_ccbar_rkst_brem_xx2:
  <<      : *yields
yld_bpkpipiee_rkst_brem_xx2:
  <<      : *yields
yld_bpk1kpipiee_rkst_brem_xx2:
  <<      : *yields
yld_bpk2kpipiee_rkst_brem_xx2:
  <<      : *yields
yld_bpkxkpipiee_rkst_brem_xx2:
  <<      : *yields
yld_comb_rkst_brem_xx2:
  <<      : *yields
yld_bdkstkpijpsiee_rkst_brem_xx2:
  <<      : *yields
yld_bdkstkpipsi2ee_rkst_brem_xx2:
  <<      : *yields
yld_bppsi2ee_rkst_brem_xx2:
  <<      : *yields
