no_pid: &no_pid
  bpkk  : (LEP_PID_E < 3.0 || LEP_PROBNN_E < 0.2) && LEP_PROBNN_K > 0.1
  bppipi: (LEP_PID_E < 3.0 || LEP_PROBNN_E < 0.2) && LEP_PROBNN_K < 0.1
# --------------------------------------------------
# Aliases
# --------------------------------------------------
plots_settings: &plots_settings
  nbins   : 30
  stacked : True
  d_leg :
    comb    : Combinatorial
    bpkpipi : $B^+\to K^+\pi^-\pi^+$
    bpkkk   : $B^+\to K^+K^-K^+$
# --------------------------------------------------
trigger          : rk_ee_nopid
yields           : model/yields/rk/misid_electron.yaml
selection:
  low    : *no_pid
  central: *no_pid
  high   : *no_pid
observable: {}
components:
  comb   : misid/rk/ee/comb.yaml
  bpkpipi: misid/rk/ee/bpkpipi.yaml
  bpkkk  : misid/rk/ee/bpkkk.yaml
constraints:
  signal_fraction      : []
  combinatorial : false
  signal_shape  : false
  misid         : null
fit:
  strategy :
    retry :
      ntries : 15
plots:
  merging : {}
  regions :
    brem_xx1 : *plots_settings
    brem_xx2 : *plots_settings
