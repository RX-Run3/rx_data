# This is a config file used for tests
# It illustrates how a fit would run for data
trigger   : rk_ee_os
selection : {}
yields    :
  nsig001:
    val : 10
    min : 0
    max : 100000
  nsig002:
    val : 10
    min : 0
    max : 100000
observable:
  low:
    name : B_M
    range:
      - 4500
      - 7000
components:
  low:
    comb   :
      models:
        central :
          pdfs :
            - gauss
          shared        : []
          reparametrize : {}
          fix           : {}
          floating      : []
      constraints: null
    bpkpee :
      component : bpkpee
      fit       : {}
      categories: {}
      plots     :
        nbins  : 60
        stacked: True
constraints:
  signal_fraction : []
  combinatorial   : False
  signal_shape    : False
fit: {}
plots:
  low:
    merging:
      brem_x12-rk_ee_os:
        - brem_xx1-rk_ee_os
        - brem_xx2-rk_ee_os
    regions:
      brem_x12-rk_ee_os:
        title   : Region 1 and 2
        nbins   : 50
        stacked : True
        d_leg :
          Gauss_ext       : Signal
          Exponential_ext : Combinatorial
      brem_xx1-rk_ee_os:
        title   : Region 1
        nbins   : 50
        stacked : True
        d_leg :
          Gauss_ext       : Signal
          Exponential_ext : Combinatorial
      brem_xx2-rk_ee_os:
        title   : Region 2
        nbins   : 50
        stacked : True
        d_leg :
          Gauss_ext       : Signal
          Exponential_ext : Combinatorial
