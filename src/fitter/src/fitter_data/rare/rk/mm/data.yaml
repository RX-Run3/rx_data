# This is a config file used for tests
# It illustrates how a fit would run for data

trigger          : rk_mm_os

yields           : model/yields/rk/rare_muon.yaml
selection        : {}
observable:
  low:
    name : B_Mass
    range:
      - 5150
      - 5850
  central:
    name : B_Mass
    range:
      - 5150
      - 5850
  high:
    name : B_Mass
    range:
      - 5150
      - 5850
components:
  comb   : rare/rk/mm/comb.yaml
  bpkpmm : rare/rk/mm/bpkpmm.yaml
constraints:
  signal_fractions      : []
  combinatorial : false
  signal_shape  : false
fit: {}
plots: # These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
  merging : {}
  regions :
    brem_xx0:
      nbins   : 50
      stacked : True
      d_leg :
        bpkpmm : $B^+\to K^+\mu^+\mu^-$ 
        comb   : Combinatorial
