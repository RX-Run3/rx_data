# This is a config file used for tests
# It illustrates how a fit would run for data

# These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
plots_cfg: &plt_cfg
  merging : {}
  regions :
    brem_xx0-rk_mm_os:
      nbins   : 50
      stacked : True
      d_leg :
        bpkpmm_brem_xx0 : $B^+\to K^+\mu^+\mu^-$
        comb_brem_xx0   : Combinatorial
# -------------------------------
trigger          : rk_mm_os
yields           : model/yields/rk/rare_muon.yaml
selection        :
  low    : {}
  central: {}
  high   : {}
observable:
  low:
    mass : bp
    range:
      - 5150
      - 5850
  central:
    mass : bp
    range:
      - 5150
      - 5850
  high:
    mass : bp
    range:
      - 5150
      - 5850
components:
  low:
    comb   : rare/rk/mm/comb.yaml
    bpkpmm : rare/rk/mm/bpkpmm.yaml
  central:
    comb   : rare/rk/mm/comb.yaml
    bpkpmm : rare/rk/mm/bpkpmm.yaml
  high:
    comb   : rare/rk/mm/comb.yaml
    bpkpmm : rare/rk/mm/bpkpmm.yaml
constraints:
  signal_fraction      : []
  combinatorial : false
  signal_shape  : true
fit: {}
plots:
  low     : *plt_cfg
  central : *plt_cfg
  high    : *plt_cfg
