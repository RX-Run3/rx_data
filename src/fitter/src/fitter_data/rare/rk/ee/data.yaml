# ----------------------------------------------------
# Aliases
# ----------------------------------------------------
reg_cfg: &reg_cfg
  nbins   : 30
  stacked : True
  plot_range :
    - 4600
    - 6900
  d_leg :
    bpkpjpsiee_brem_x12 : $B^+\to K^+ J/\psi(\to e^+e^-)$
    bpkpjpsiee_brem_xx1 : $B^+\to K^+ J/\psi(\to e^+e^-)$
    bpkpjpsiee_brem_xx2 : $B^+\to K^+ J/\psi(\to e^+e^-)$
    # ---------
    bpkppsi2ee_brem_x12 : $B^+\to K^+ \psi(2S)(\to e^+e^-)$
    bpkppsi2ee_brem_xx1 : $B^+\to K^+ \psi(2S)(\to e^+e^-)$
    bpkppsi2ee_brem_xx2 : $B^+\to K^+ \psi(2S)(\to e^+e^-)$
    # ---------
    bpkstkpiee_brem_x12 : $B^+\to K^{*+}(\to K^+\pi^0)e^+e^-$
    bpkstkpiee_brem_xx1 : $B^+\to K^{*+}(\to K^+\pi^0)e^+e^-$
    bpkstkpiee_brem_xx2 : $B^+\to K^{*+}(\to K^+\pi^0)e^+e^-$
    # ---------
    bdkstkpiee_brem_x12 : $B^0\to K^{*0}(\to K^+\pi^-)e^+e^-$
    bdkstkpiee_brem_xx1 : $B^0\to K^{*0}(\to K^+\pi^-)e^+e^-$
    bdkstkpiee_brem_xx2 : $B^0\to K^{*0}(\to K^+\pi^-)e^+e^-$
    # ---------
    bsphiee_brem_x12    : $B_s\to \phi(\to K^+K^-)e^+e^-$
    bsphiee_brem_xx1    : $B_s\to \phi(\to K^+K^-)e^+e^-$
    bsphiee_brem_xx2    : $B_s\to \phi(\to K^+K^-)e^+e^-$
    # ---------
    comb_brem_x12       : Combinatorial
    comb_brem_xx1       : Combinatorial
    comb_brem_xx2       : Combinatorial
    # ---------
    bpkpee_brem_x12     : $B^+\to K^+ e^+e^-$
    bpkpee_brem_xx1     : $B^+\to K^+ e^+e^-$
    bpkpee_brem_xx2     : $B^+\to K^+ e^+e^-$
    # ---------
    ccbar_brem_x12      : $B\to c\bar{c}(\to e^+e^-) + X$
    ccbar_brem_xx1      : $B\to c\bar{c}(\to e^+e^-) + X$
    ccbar_brem_xx2      : $B\to c\bar{c}(\to e^+e^-) + X$
    # ---------
    bpkkk_brem_x12      : $B^+\to K^+K^+K^-$
    bpkkk_brem_xx1      : $B^+\to K^+K^+K^-$
    bpkkk_brem_xx2      : $B^+\to K^+K^+K^-$
    # ---------
    bpkpipi_brem_x12    : $B^+\to K^+\pi^+\pi^-$
    bpkpipi_brem_xx1    : $B^+\to K^+\pi^+\pi^-$
    bpkpipi_brem_xx2    : $B^+\to K^+\pi^+\pi^-$
plt_cfg: &plt_cfg
  merging:
    brem_x12-rk_ee_os:
      - brem_xx1-rk_ee_os
      - brem_xx2-rk_ee_os
  regions:
    brem_x12-rk_ee_os: *reg_cfg
    brem_xx1-rk_ee_os: *reg_cfg
    brem_xx2-rk_ee_os: *reg_cfg
default_components: &comp
  comb       : rare/rk/ee/comb.yaml
  bdkstkpiee : rare/rk/ee/bdkstkpiee_np.yaml
  bpkstkpiee : rare/rk/ee/bpkstkpiee_np.yaml
  bsphiee    : rare/rk/ee/bsphiee_np.yaml
  bpkpjpsiee : rare/rk/ee/bpkpjpsiee_np.yaml
  bpkppsi2ee : rare/rk/ee/bpkppsi2ee_np.yaml
  bpkpee     : rare/rk/ee/bpkpee.yaml.j2
  #bpkkk      : rare/rk/ee/bpkkk_np.yaml
  #bpkpipi    : rare/rk/ee/bpkpipi_np.yaml
  #bpkpee     : rare/rk/ee/bpkpee_np.yaml
# ----------------------------------------------------
trigger          : rk_ee_os
yields           : model/yields/rk/rare_electron.yaml
selection        :
  low    : {}
  central:
    leakage : TMath::Abs(B_const_mass_M - 5280) > 100
    #leakage : 'true'
  high   : {}
observable:
  low:
    mass : bp_bcor
    range:
      - 4600
      - 6996
  central:
    mass : bp_bcor
    range:
      - 4600
      - 6996
  high:
    mass : bp_bcor
    range:
      - 4600
      - 6996
components:
  low:
    <<: *comp
  central:
    <<: *comp
  high:
    comb       : rare/rk/ee/comb.yaml
    ccbar      :
      kind : CCbarPDFTF
    bdkstkpiee : rare/rk/ee/bdkstkpiee_np.yaml
    bpkstkpiee : rare/rk/ee/bpkstkpiee_np.yaml
    bsphiee    : rare/rk/ee/bsphiee_np.yaml
    bpkpee     : rare/rk/ee/bpkpee.yaml.j2
constraints:
  misid    : misid/rk/ee/data_misid.yaml
  signal_fraction :
    - bdkstkpiee
    - bpkstkpiee
    - bsphiee
  combinatorial: true
  signal_shape : true
fit  : {}
plots:
  low     : *plt_cfg
  central : *plt_cfg
  high    : *plt_cfg
