# This is a config file used for tests
# It illustrates how a fit would run for data

trigger          : Hlt2RD_B0ToKpPimEE_MVA
yields           : model/yields/rkst/rare_electron.yaml
selection        : {}
observable:
  low:
    name : B_Mass_smr
    range:
      - 4600
      - 6996
  central:
    name : B_Mass_smr
    range:
      - 4600
      - 6996
  high:
    name : B_Mass_smr
    range:
      - 4600
      - 6996
components:
  comb           : rare/rkst/ee/comb.yaml
  ccbar          : rare/rkst/ee/ccbar.yaml
  bpkpipiee      : rare/rkst/ee/bpkpipiee_np.yaml
  bdkstkpijpsiee : rare/rkst/ee/bdkstkpijpsiee_np.yaml
  bdkstkpipsi2ee : rare/rkst/ee/bdkstkpipsi2ee_np.yaml
  bdkstkpiee     : rare/rkst/ee/bdkstkpiee.yaml.j2
constraints :
  pre_rare : []
fit: {}
plots: # These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
  nbins   : 30
  stacked : True
  d_leg :
    comb           : Combinatorial
    ccbar          : $B\to c\bar{c}(\to e^+e^-) + X$
    bdkstkpijpsiee : $B^0\to K^*(\to K^+\pi^-) J/\psi(\to e^+e^-)$
    bdkstkpipsi2ee : $B^0\to K^*(\to K^+\pi^-) \psi(2S)(\to e^+e^-)$
    bpkpipiee      : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    bdkstkpiee     : $B^0\to K^*(\to K^+\pi^-)e^+e^-$
