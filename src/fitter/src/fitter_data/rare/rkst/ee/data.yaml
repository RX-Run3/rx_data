# ----------------------------------------------------
# Aliases
# ----------------------------------------------------
reg_cfg: &reg_cfg
  nbins   : 30
  stacked : True
  plot_range :
    - 4600
    - 6800
  d_leg :
    comb_brem_x12           : Combinatorial
    comb_brem_xx1           : Combinatorial
    comb_brem_xx2           : Combinatorial
    # ---------
    ccbar_brem_x12          : $B\to c\bar{c}(\to e^+e^-) + X$
    ccbar_brem_xx1          : $B\to c\bar{c}(\to e^+e^-) + X$
    ccbar_brem_xx2          : $B\to c\bar{c}(\to e^+e^-) + X$
    # ---------
    bdkstkpijpsiee_brem_x12 : $B^0\to K^*(\to K^+\pi^-) J/\psi(\to e^+e^-)$
    bdkstkpijpsiee_brem_xx1 : $B^0\to K^*(\to K^+\pi^-) J/\psi(\to e^+e^-)$
    bdkstkpijpsiee_brem_xx2 : $B^0\to K^*(\to K^+\pi^-) J/\psi(\to e^+e^-)$
    # ---------
    bdkstkpipsi2ee_brem_x12 : $B^0\to K^*(\to K^+\pi^-) \psi(2S)(\to e^+e^-)$
    bdkstkpipsi2ee_brem_xx1 : $B^0\to K^*(\to K^+\pi^-) \psi(2S)(\to e^+e^-)$
    bdkstkpipsi2ee_brem_xx2 : $B^0\to K^*(\to K^+\pi^-) \psi(2S)(\to e^+e^-)$
    # ---------
    bpkpipiee_brem_x12      : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    bpkpipiee_brem_xx1      : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    bpkpipiee_brem_xx2      : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    # ---------
    bpk1kpipiee_brem_x12    : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    bpk1kpipiee_brem_xx1    : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    bpk1kpipiee_brem_xx2    : $B^+\to K_1^+(1270)(\to K^+\pi^+\pi^-)e^+e^-$
    # ---------
    bpk2kpipiee_brem_x12    : $B^+\to K_2^+(1430)(\to K^+\pi^+\pi^-)e^+e^-$
    bpk2kpipiee_brem_xx1    : $B^+\to K_2^+(1430)(\to K^+\pi^+\pi^-)e^+e^-$
    bpk2kpipiee_brem_xx2    : $B^+\to K_2^+(1430)(\to K^+\pi^+\pi^-)e^+e^-$
    # ---------
    bpkxkpipiee_brem_x12    : $B^+\to K_{1,2}^+(\to K^+\pi^+\pi^-)e^+e^-$
    bpkxkpipiee_brem_xx1    : $B^+\to K_{1,2}^+(\to K^+\pi^+\pi^-)e^+e^-$
    bpkxkpipiee_brem_xx2    : $B^+\to K_{1,2}^+(\to K^+\pi^+\pi^-)e^+e^-$
    # ---------
    bdkstkpiee_brem_x12     : $B^0\to K^*(\to K^+\pi^-)e^+e^-$
    bdkstkpiee_brem_xx1     : $B^0\to K^*(\to K^+\pi^-)e^+e^-$
    bdkstkpiee_brem_xx2     : $B^0\to K^*(\to K^+\pi^-)e^+e^-$
plt_cfg: &plt_cfg
  merging:
    brem_x12-rkst_ee_os:
      - brem_xx1-rkst_ee_os
      - brem_xx2-rkst_ee_os
  regions:
    brem_x12-rkst_ee_os : *reg_cfg
    brem_xx1-rkst_ee_os : *reg_cfg
    brem_xx2-rkst_ee_os : *reg_cfg
default_components: &comp
  comb           : rare/rkst/ee/comb.yaml
  ccbar          : rare/rkst/ee/ccbar.yaml
  bpkxkpipiee    : rare/rkst/ee/bpkxkpipiee_np.yaml
  bdkstkpijpsiee : rare/rkst/ee/bdkstkpijpsiee_np.yaml
  bdkstkpipsi2ee : rare/rkst/ee/bdkstkpipsi2ee_np.yaml
  bdkstkpiee     : rare/rkst/ee/bdkstkpiee.yaml.j2
# ----------------------------------------------------
trigger          : rkst_ee_os
yields           : model/yields/rkst/rare_electron.yaml
selection        :
  low    : {}
  central:
    leakage : TMath::Abs(B_const_mass_M - 5280) > 100
    #leakage : 'true'
  high   : {}
observable:
  low:
    mass : bd_bcor
    range:
      - 4600
      - 7000
  central:
    mass : bd_bcor
    range:
      - 4600
      - 7000
  high:
    mass : bd_bcor
    range:
      - 4600
      - 7000
components:
  low:
    <<: *comp
  central:
    <<: *comp
  high:
    <<: *comp
constraints :
  signal_fraction      : []
  combinatorial : true
  signal_shape  : true
fit: {}
plots:
  low     : *plt_cfg
  central : *plt_cfg
  high    : *plt_cfg
