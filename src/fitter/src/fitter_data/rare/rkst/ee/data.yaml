    name : B_Mass
    range:
      - 4500
      - 6996
  central:
    name : B_Mass
    range:
      - 4500
      - 6996
  high:
    name : B_Mass
    range:
      - 4500
      - 6996
components:
  comb           : rare/rkst/ee/comb.yaml
  ccbar          : rare/rkst/ee/ccbar.yaml
  #bpkpipiee      : rare/rkst/ee/bpkpipiee_np.yaml
  #bpk1kpipiee    : rare/rkst/ee/bpk1kpipiee_np.yaml
  #bpk2kpipiee    : rare/rkst/ee/bpk2kpipiee_np.yaml
  bpkxkpipiee    : rare/rkst/ee/bpkxkpipiee_np.yaml
  bdkstkpijpsiee : rare/rkst/ee/bdkstkpijpsiee_np.yaml
  bdkstkpipsi2ee : rare/rkst/ee/bdkstkpipsi2ee_np.yaml
  bdkstkpiee     : rare/rkst/ee/bdkstkpiee.yaml.j2
constraints :
