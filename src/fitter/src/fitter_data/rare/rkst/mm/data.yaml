# This is a config file used for tests
# It illustrates how a fit would run for data

# These entries should be taken from https://gitlab.cern.ch/rx_run3/dmu#fit-plotting
plt_cfg: &plt_cfg
  merging : {}
  regions :
    brem_xx0-rkst_mm_os:
      nbins   : 50
      stacked : True
      d_leg :
        bdkstkpimm : $B^0\to K^0(\to K^+\pi^-)\mu^+\mu^-$ 
        comb       : Combinatorial
trigger          : rkst_mm_os
yields           : model/yields/rkst/rare_muon.yaml
selection        :
  low    : {}
  central: {}
  high   : {}
observable:
  low:
    name : B_Mass
    range:
      - 5150
      - 5850
  central:
    name : B_Mass
    range:
      - 5150
      - 5850
  high:
    name : B_Mass
    range:
      - 5150
      - 5850
components:
  low:
    comb       : rare/rkst/mm/comb.yaml
    bdkstkpimm : rare/rkst/mm/bdkstkpimm.yaml
  central:
    comb       : rare/rkst/mm/comb.yaml
    bdkstkpimm : rare/rkst/mm/bdkstkpimm.yaml
  high:
    comb       : rare/rkst/mm/comb.yaml
    bdkstkpimm : rare/rkst/mm/bdkstkpimm.yaml
constraints:
  signal_fraction      : []
  combinatorial : false
  signal_shape  : false
fit: {}
plots: 
  low     : *plt_cfg
  central : *plt_cfg
  high    : *plt_cfg
