# Boost nbrem = 2 by 2.5% in MC WRT nbrem = 1
weight   : '0.0125 * nbrem * nbrem - 0.0125 * nbrem + 1'
selection:
  q2 : 'true'
  cmb: 'true'
  prc: 'true'
db_dir : DB/hqm/latest
columns:
  # --------------
  # Binning
  # --------------
  - B_PT
  - B_ETA
  - ll_angle
  - ll_max_PT
  - nTracks
  - nbrem
  - mva.mva_cmb
  - mva.mva_prc
  # --------------
  # Categorization
  # --------------
  - q2_dtf
  - q2
  - block
  # --------------
  # Fitting
  # --------------
  - B_Mass
  - B_const_mass_M
  - B_const_mass_psi2S_M
