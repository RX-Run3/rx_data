bandwidth : 3 
fft_npt   : 1000
observable:
  name       : B_Mass
  kdem_range : [ 3500, 6500]
  mass_range : [ 4500, 6500]
  tran_range : [ -500,  500] # This range has to be narrower than the `mass_range`
fits:
  run_gof   : false
  do_errors : true 
plots :
  stacked : false # Do not stack if using only one component
  nbins   : 100
qsq:
  - source     : psi2
    target     : high
    models     : [cbl]
    plots      : 
      plot_range : [5100, 5500]
  - source     : jpsi
    target     : high
    models     : [cbl]
    plots      : 
      plot_range : [5500, 7000]
  - source     : jpsi
    target     : jpsi
    models     : [cbl, cbr]
    plots      : 
      plot_range : [4500, 5800]
  - source     : jpsi
    target     : psi2
    models     : [suj, cbl]
    plots      : 
      plot_range : [5000, 6000]
  - source     : psi2
    target     : jpsi
    models     : [suj, cbl]
    plots      : 
      plot_range : [4500, 5500]
  - source     : psi2
    target     : psi2
    models     : [suj, cbl]
    plots      : 
      plot_range : [4500, 6000]
