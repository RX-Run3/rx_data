bandwidth : 3
fft_npt   : 1000
observable:
  name       : B_Mass
  kdem_range : [ 3500, 9000]
  mass_range : [ 4600, 6700]
  tran_range : 
    jpsi :
      jpsi :
        [-1000, 1000]
      psi2 :
        [    0, 2000]
      high :
        [  500, 2500]
    psi2 :
      jpsi :
        [-2000,    0]
      psi2 :
        [-1200,  800]
      high :
        [    0, 2000]
fits:
  run_gof   : false
  do_errors : true
plots :
  stacked : false # Do not stack if using only one component
  nbins   : 100
qsq:
  - source     : jpsi
    target     : jpsi
    models     : [cbl, cbr]
    plots      :
      plot_range : [4600, 6000]
  - source     : jpsi
    target     : psi2
    models     : [suj]
    plots      :
      plot_range : [5200, 6200]
  - source     : jpsi
    target     : high
    models     : [suj]
    plots      :
      plot_range : [5500, 7500]
  - source     : psi2
    target     : jpsi
    models     : [cbl]
    plots      :
      plot_range : [4600, 5300]
  - source     : psi2
    target     : psi2
    models     : [suj]
    plots      :
      plot_range : [4600, 6000]
  - source     : psi2
    target     : high
    models     : [suj]
    plots      :
      plot_range : [5000, 6500]
models:
  rk:
    jpsi: [bpkpjpsimm    , bpkpjpsiee    ]
    psi2: [bpkppsi2mm    , bpkppsi2ee    ]
  rkst:
    jpsi: [bdkstkpijpsimm, bdkstkpijpsiee]
    psi2: [bdkstkpipsi2mm, bdkstkpipsi2ee]
