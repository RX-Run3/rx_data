<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyright Report</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; }
  .header { background: #1e1e2e; color: #fff; padding: 24px 32px; }
  .header h1 { margin: 0 0 8px 0; font-size: 1.5em; }
  .header .meta { color: #aaa; font-size: 0.9em; }
  .status { display: inline-block; padding: 4px 14px; border-radius: 6px; font-weight: bold;
             background: $status_color; color: #fff; margin-left: 12px; vertical-align: middle; }
  .stats { display: flex; gap: 16px; padding: 20px 32px; background: #fff;
            border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .stat-box { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px;
               padding: 12px 24px; text-align: center; min-width: 100px; }
  .stat-box .num { font-size: 2em; font-weight: bold; }
  .stat-box .label { font-size: 0.8em; color: #888; text-transform: uppercase; }
  .errors .num { color: #e05252; }
  .warnings .num { color: #e09a52; }
  .container { padding: 24px 32px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
           border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  th { background: #2d2d3f; color: #fff; padding: 10px 14px; text-align: left; font-size: 0.85em; }
  td { padding: 8px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .file-row { background: #f0f4ff; cursor: pointer; user-select: none; }
  .file-row:hover { background: #e0eaff; }
  .file-row .arrow { float: right; transition: transform 0.2s; color: #888; }
  .file-row.open .arrow { transform: rotate(90deg); }
  .issue-row.hidden { display: none; }
  .issue-row td:first-child { width: 80px; }
  .issue-row td:nth-child(2) { width: 100px; }
</style>
</head>
<body>
<div class="header">
  <h1>Pyright Type Check Report <span class="status">$status_text</span></h1>
  <div class="meta">Pyright v$version &nbsp;|&nbsp; $run_time</div>
</div>
<div class="stats">
  <div class="stat-box errors"><div class="num">$error_count</div><div class="label">Errors</div></div>
  <div class="stat-box warnings"><div class="num">$warning_count</div><div class="label">Warnings</div></div>
  <div class="stat-box"><div class="num">$info_count</div><div class="label">Info</div></div>
  <div class="stat-box"><div class="num">$files_analyzed</div><div class="label">Files Analyzed</div></div>
  <div class="stat-box"><div class="num">$files_with_issues</div><div class="label">Files with Issues</div></div>
</div>
<div class="container">
  <table>
    <thead><tr><th>Location</th><th>Severity</th><th>Message</th><th>Rule</th></tr></thead>
    <tbody>$rows</tbody>
  </table>
</div>
<script>
function toggleFile(row) {
  row.classList.toggle('open');
  let next = row.nextElementSibling;
  while (next && next.classList.contains('issue-row')) {
    next.classList.toggle('hidden');
    next = next.nextElementSibling;
  }
}
</script>
</body>
</html>
