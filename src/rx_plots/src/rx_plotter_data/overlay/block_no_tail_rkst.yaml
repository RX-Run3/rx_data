general:
  size : [10, 8]
definitions: {}
selection:
  no_tail : B_const_mass_M > 5160
  mass    : (1)
saving:
  plt_dir : overlay/block_no_tail
cutflow:
  Block 1 : block == 1
  Block 2 : block == 2
  Block 3 : block == 3
  Block 4 : block == 4
  Block 5 : block == 5
  Block 6 : block == 6
  Block 7 : block == 7
  Block 8 : block == 8
plots:
  B_Mass:
      binning    : [4500, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M(B^0)$', 'Normalized']
      title      : ''
      name       : bmass
      normalized : true
      styling:
        histtype : step
  B_const_mass_M:
      binning    : [5000, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M_{DTF}(B^0)$', 'Normalized']
      title      : ''
      name       : bmass_dtf
      normalized : true
      styling:
        histtype : step
