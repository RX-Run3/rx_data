general:
  size : [12, 10]
definitions: {}
selection:
  no_tail : B_const_mass_M > 5160
  mass    : (1)
cutflow:
  Run3            : (1)
  Emulate Run 1&2 : L1_PT >  2500 && nPVs < 4
mass_binning:
    jpsi : [4500, 6000, 60]
saving:
  plt_dir : overlay/resolution/L0Emulation
plots:
  B_M:
      binning    : [4500, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M(B^+)$', 'Normalized']
      title      : ''
      name       : 'bmass_raw'
      normalized : true
  B_Mass:
      binning    : [4500, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M_{corr}(B^0)$', 'Normalized']
      title      : ''
      name       : 'bmass_cor'
      normalized : true
plugin:
    fwhm:
        obs    : [4500, 6000]
        plot   : true
        format : FWHM={:.0f}
        add_std: True
