# This config is used to overlay different distributions (mostly masses)
# in different mva_prc bins
styling: &sty
  histtype : step
  linestyle: '-'
general:
  size : [12, 8]
selection:
  q2   : (1)
  mass : (1)
cutflow:
  None : (1)
  '$m(B^0)-400$ MeV': B_const_mass_M > 5280 - 400
  '$m(B^0)-500$ MeV': B_const_mass_M > 5280 - 500
  '$m(B^0)-600$ MeV': B_const_mass_M > 5280 - 600
  '$m(B^0)-800$ MeV': B_const_mass_M > 5280 - 800
saving:
  plt_dir : overlay/psi2S_suppession
plots:
  Jpsi_M:
    binning    : [3200, 3800, 30]
    yscale     : 'linear'
    labels     : ['M$(J/\psi)$[MeV]', 'Normalized']
    title      : Mass distribution for different lower cuts on $B^0_{DTF}$
    name       : jpsi_mass_mva_prc_raw
    normalized : false
    styling:
      <<: *sty
    vline :
      x     : 3686
      label : $\psi(2S)$
      ls    : --
      lw    : 3
      c     : gray
  Jpsi_Mass:
    binning    : [3200, 3800, 30]
    yscale     : 'linear'
    labels     : ['$M_{corr}(J/\psi)$[MeV]', 'Normalized']
    title      : Mass distribution for different lower cuts on $B^0_{DTF}$
    name       : jpsi_mass_mva_prc_cor
    normalized : false
    styling:
      <<: *sty
    vline :
      x     : 3686
      label : $\psi(2S)$
      ls    : --
      lw    : 3
      c     : gray
  B_M:
    binning    : [4500, 6000, 60]
    yscale     : 'linear'
    labels     : ['M$(B^0)$[MeV]', 'Normalized']
    title      : Mass distribution for different lower cuts on $B^0_{DTF}$
    name       : b_mass_mva_prc_raw
    normalized : true
    styling:
      <<: *sty
  B_Mass:
    binning    : [4500, 6000, 60]
    yscale     : 'linear'
    labels     : ['$M_{corr}(B^0)$[MeV]', 'Normalized']
    title      : Mass distribution for different lower cuts on $B^0_{DTF}$
    name       : b_mass_mva_prc_cor
    normalized : true
    styling:
      <<: *sty
  B_const_mass_M:
    binning    : [5100, 5500, 60]
    yscale     : 'linear'
    labels     : ['$M_{DTF}(B^0)$[MeV]', 'Normalized']
    title      : Mass distribution for different lower cuts on $B^0_{DTF}$
    name       : b_dtf_mass_mva_prc_raw
    normalized : true
    styling:
      <<: *sty
