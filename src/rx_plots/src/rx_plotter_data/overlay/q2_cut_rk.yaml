# Used to check how cut on q2 changes shape of B mass

general:
  size : [12, 8]
definitions: {}
selection:
  q2      : (1)
  mass    : (1)
cutflow:
  'none'  : (1)
  '2150'  : Jpsi_Mass > 2150
  '2350'  : Jpsi_Mass > 2350
  '2450'  : Jpsi_Mass > 2450
saving:
  plt_dir : overlay/q2_cut
plots:
  B_const_mass_M:
    binning    : [5000, 6000, 60]
    yscale     : 'linear'
    labels     : ['$M_{DTF}(B^+)$', 'Normalized']
    title      : ''
    name       : 'bmass_dtf'
    normalized : true
    styling:
      histtype : step
  B_Mass:
    binning    : [4300, 6000, 60]
    yscale     : 'linear'
    labels     : ['$M_{corr}(B^+)$', 'Normalized']
    title      : ''
    name       : 'bmass'
    normalized : true
    styling:
      histtype : step
  Jpsi_Mass:
    binning    : [2000, 3500, 60]
    yscale     : 'linear'
    labels     : ['$M_{corr}(J/\psi)$', 'Normalized']
    title      : ''
    name       : 'jmass'
    normalized : false
    styling:
      histtype : step
