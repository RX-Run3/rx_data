general:
  size : [10, 8]
definitions: {}
selection:
  q2   : 'true'
  mass : 'true'
saving:
  plt_dir : overlay/q2_kind
cutflow:
  DTF      : q2_dtf > 11000000 && q2_dtf < 15000000
  Standard : q2     > 11000000 && q2     < 15000000
plots:
  B_Mass:
      binning    : [4500, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M(B^0)$', 'Normalized']
      title      : ''
      name       : bmass
      normalized : true
      styling:
        histtype : step
  B_const_mass_psi2S_M:
      binning    : [5000, 6000, 30]
      yscale     : 'linear'
      labels     : ['$M_{DTF}(B^+)$', 'Normalized']
      title      : ''
      name       : bmass_dtf
      normalized : true
      styling:
        histtype : step
