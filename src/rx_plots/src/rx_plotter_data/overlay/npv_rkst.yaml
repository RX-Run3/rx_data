general:
  size : [15, 10]
definitions: {}
overide_selection:
  mass     : B_const_mass_M > 5180
cutflow:
  npv_00_03 : nPVs > 0 && nPVs <=3
  npv_03_05 : nPVs > 3 && nPVs <=5
  npv_05_07 : nPVs > 5 && nPVs <=7
  npv_07_xx : nPVs > 7
saving:
  plt_dir : overlay/npv
plots:
  B_M:
    binning    : [4500, 6000, 100]
    yscale     : 'linear'
    labels     : ['$M(B^0)$', 'Normalized']
    title      : ''
    name       : 'bmass_raw'
    normalized : true
  B_const_mass_M:
    binning    : [5100, 5500, 100]
    yscale     : 'linear'
    labels     : ['$M_{DTF}(B^0)$', 'Normalized']
    title      : ''
    name       : 'bmass_dtf'
    normalized : true
  nPVs :
    binning    : [0, 15, 15]
    yscale     : 'linear'
    labels     : ['nPVs', 'Normalized']
    title      : ''
    name       : 'npvs'
    normalized : false
