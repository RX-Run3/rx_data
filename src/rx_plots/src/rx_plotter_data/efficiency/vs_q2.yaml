# This config file is meant to be used with `efficiency_vs_q2`
hist_conf:
  'true':
    name  : q2_true
    bins  : 50
    start : 0
    stop  : 22
    label : $q_{true}^2 [\text{GeV}^2]$
  default:
    name  : q2
    bins  : 50
    start : 0
    stop  : 22
    label : $q^2 [\text{GeV}^2]$
  constrained:
    name  : q2
    bins  : 50
    start : 0
    stop  : 22
    label : $q_{DTF}^2 [\text{GeV}^2]$
bounds:
  low     : 1.1
  central : 6.0
  jpsi    : 11.0
  psi2    : 15.0
  high    : 22.0
line_style:
  color : gray
  ls    : --
  lw    : 2
figure:
  size : [20, 10]
