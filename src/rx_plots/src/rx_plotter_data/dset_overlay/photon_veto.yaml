datasets:
  Nominal:
    friends:
      brem_track_2 : v4
  v1:
    friends:
      brem_track_2 : v5
  v2:
    friends:
      brem_track_2 : v6
# ------------------------------
selection:
  extra: L1_BREMHYPOAREA == 2 && L2_BREMHYPOAREA == 2
  mass : B_const_mass_M > 5180
  prc  : (1)
  cmb  : (1)
general:
  size : [15, 10]
plots:
  B_Mass:
    binning    : [4500, 6500, 40]
    yscale     : linear
    labels     : ['$M(B^+)$', 'Normalized']
    name       : bmass_correction
    normalized : true
    styling    :
      Nominal  :
        histtype : step
        linestyle: '-'
      v1       :
        histtype : step
        linestyle: '-'
      v2       :
        histtype : step
        linestyle: '-'
    vline :
      x         : 5280
      label     : PDG
      linestyle : ':'
      color     : green
saving:
  plt_dir : plots/dset_overlay/photon_veto
