general:
  size : [15, 10]
selection:
  max_ran_entries : -1
  cuts:
    pide : L1_PIDe > 1 && L2_PIDe > 1
    pidk : H_PID_K > -2
plots:
  L1_PIDe : &lep_pid
    binning : [-15,+15, 30]
    labels  : ['$\text{PID}_{e}(e^+)$', 'Entries'] # Labels are optional, will use varname and Entries as labels if not present
    weights : weights
    name    : l1_pide
    styling : &style
      '0.1 x New':
        histtype : fill
        color    : red
        alpha    : 0.4
      '2e-2 x New':
        histtype : fill
        color    : red
        alpha    : 0.4
      '1e-4 x New':
        histtype : fill
        color    : red
        alpha    : 0.4
      'Original':
        histtype : fill
        color    : green
        alpha    : 0.4
      'New with PID':
        color    : blue
  L2_PIDe:
    <<: *lep_pid
    name    : l2_pide
    labels  : ['$\text{PID}_{e}(e^-)$', 'Entries'] # Labels are optional, will use varname and Entries as labels if not present
  H_PID_K   :
    binning : [-15,+15, 30]
    labels  : ['$\text{PID}_{K}(K^+)$', 'Entries'] # Labels are optional, will use varname and Entries as labels if not present
    weights : weights
    name    : k_pidk
    styling :
      <<: *style
