styles: &styles
  Original:
    histtype : step
    linestyle: '-'
  Corrected:
    histtype : step
    linestyle: '-'
  Corrected and L0:
    histtype : step
    linestyle: '-'

general:
  size : [15, 10]
definitions:
  max_ll_pt   : TMath::Max(L1_TRACK_PT, L2_TRACK_PT)
selection:
  mass  : B_const_mass_M > 5160  # Remove part reco
  cmb   : mva_cmb > 0.99         # Remove combinatorial
comparison:
  Original:
    vars:
      bmass :    B_M
      jmass : Jpsi_M
      xbrem : nbrem_org
  Corrected:
    vars:
      bmass : B_Mass
      jmass : Jpsi_Mass
      xbrem : nbrem
  Corrected and L0:
    cuts:
      npv   : nPVs < 4
      L0    : max_ll_pt > 2500
    vars:
      bmass : B_Mass
      jmass : Jpsi_Mass
      xbrem : nbrem
saving:
  plt_dir : plots/comparison/resolution
plots:
  xbrem:
    binning    : [0, 3, 3]
    yscale     : linear
    labels     : ['n$\gamma$', 'Brem Fraction']
    name       : brem_fraction
    normalized : true
    styling :
      <<: *styles
  bmass:
    binning    : [4500, 6500, 40]
    yscale     : linear
    labels     : ['$M(B^+)$', 'Normalized']
    name       : bmass_correction
    normalized : true
    vline :
      x     : 5280
      label : $B^{+(0)}$
      ls    : ':'
      c     : green
  nLongTracks:
    binning    : [0, 150, 30]
    yscale     : linear
    labels     : ['Long Tracks', 'Normalized']
    name       : long_tracks
    normalized : true
    styling :
      <<: *styles
  nPVs:
    binning    : [1, 7, 6]
    yscale     : linear
    labels     : ['nPVs', 'Normalized']
    name       : npv
    normalized : true
    styling :
      <<: *styles
plugin:
  fwhm:
    bmass:
      obs    : [4500, 6000]
      plot   : true
      format : FWHM={:.0f} MeV
      add_std: True
