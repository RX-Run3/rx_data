# Used to compare q2 distribution for charmoniunm samples for different q2 definitions
general:
  size : [15, 10]
selection: {}
definitions:
  qsq_gev     : q2 / 1e6
  qsq_dtf_gev : q2_dtf / 1e6
comparison:
  Original:
    vars:
      qsq : qsq_gev
  DTF:
    vars:
      qsq : qsq_dtf_gev
saving:
  plt_dir : plots/ccbar_qsq
plots:
  qsq:
    binning    : [6, 22, 100]
    yscale     : linear
    labels     : ['$q^2$[GeV]', 'Entries']
    name       : ccbar_qsq
    normalized : false
    styling:
      Original:
        histtype : fill
        alpha    : 0.7
        color    : gray
      DTF:
        histtype : step
        linestyle: '-'
        color    : blue
    vline   :
      x     : 15
      label : High $q^2$
      ls    : --
      c     : black
      lw    : 1
